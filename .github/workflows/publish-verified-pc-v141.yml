name: Publish verified FileHub PC v1.3.141 new Office document save repair
on:
  push:
    branches: [pc/windows]
permissions:
  contents: write
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[PC_V141_BINARY_HANDOFF_20261124]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download, reassemble and verify Windows publisher archive
        shell: bash
        run: |
          set -euo pipefail
          for i in {00..10}; do
            curl --http1.1 --fail --location --retry 7 --retry-all-errors --retry-delay 3 --connect-timeout 15 --max-time 330 "https://sierra-statements-giant-registry.trycloudflare.com/pc-v141-part${i}" -o "pc-v141-part${i}"
            test -s "pc-v141-part${i}"
            echo "PC141_PART_${i}_READY"
          done
          cat pc-v141-part{00..10} > FileHub-AIO-PC-1.3.141-win-x64.zip
          test "$(stat -c '%s' FileHub-AIO-PC-1.3.141-win-x64.zip)" -eq 169212207
          echo '01BE32D97DA013B10FB3A28EC1C1CA3FBBC746337D45799247D862C24C219ED8  FileHub-AIO-PC-1.3.141-win-x64.zip' | sha256sum -c -
          unzip -tqq FileHub-AIO-PC-1.3.141-win-x64.zip
          for file in FileHubAIO.exe tools/NASMountLockBridge.exe tools/rclone.exe tools/google-oauth-desktop.json README_PC_V141_NEW_DOCUMENT_SAVE_KR.md RAIDRIVE_2026_10_COMPARATIVE_RESEARCH.md; do
            unzip -Z1 FileHub-AIO-PC-1.3.141-win-x64.zip | grep -Fx "$file"
          done
          printf '%s\n' '01BE32D97DA013B10FB3A28EC1C1CA3FBBC746337D45799247D862C24C219ED8  FileHub-AIO-PC-1.3.141-win-x64.zip' > SHA256SUMS
          echo 'PC141_VERIFIED_ARCHIVE_SUCCESS'
      - name: Publish Windows PC-only OTA release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view pc-v1.3.141 >/dev/null 2>&1; then
            echo 'Refusing to replace existing PC v1.3.141 release'
            exit 1
          fi
          cat > notes.txt <<'NOTES'
          FileHub AIO PC v1.3.141 - New Office document save repair

          - Fix Excel SaveAs failures when WebDAV omits temporary-file ETags and when Office writes nonsequential temporary data.
          - Commit Office saves synchronously; retain existing owner-file locking and guarded target replacement.
          - Local real Excel WinFsp/WebDAV lab: first save, five repeat saves, one owner marker per save, final server workbook content verified. Conflict and recovery checks passed.
          - Production NAS retest pending. Ordinary Explorer copy completion still can precede server completion; transfer timing work remains separate. This release is for the requested save-fix user test.
          - SHA256: 01BE32D97DA013B10FB3A28EC1C1CA3FBBC746337D45799247D862C24C219ED8
          NOTES
          gh release create pc-v1.3.141 FileHub-AIO-PC-1.3.141-win-x64.zip SHA256SUMS --target "$GITHUB_SHA" --latest=false --title 'FileHub AIO PC v1.3.141' --notes-file notes.txt
          gh release view pc-v1.3.141 --json tagName,url,assets > release.json
          python3 - <<'PY'
          import json
          r=json.load(open('release.json',encoding='utf-8'))
          assert r['tagName']=='pc-v1.3.141'
          a=next(x for x in r['assets'] if x['name']=='FileHub-AIO-PC-1.3.141-win-x64.zip')
          assert a['size']==169212207
          assert a.get('digest','').lower()=='sha256:01be32d97da013b10fb3a28ec1c1ca3fbbc746337d45799247d862c24c219ed8'
          print('PC141_OFFICIAL_RELEASE_SUCCESS')
          PY
