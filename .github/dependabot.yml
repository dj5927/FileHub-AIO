# GitHub reads this config from repository default branch main.
# PC updates target pc/windows and Android updates target main.
# Neither is automatically merged or published as an app release.
version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/"
      - "/LockBridge"
    target-branch: "pc/windows"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    commit-message:
      prefix: "deps(pc)"
    groups:
      pc-nuget-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
    ignore:
      # Always update WinFsp driver MSI + .NET binding together. A standalone
      # NuGet bump can break mounts and skip MSI signature/hash verification.
      - dependency-name: "winfsp.net"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "pc/windows"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:20"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    commit-message:
      prefix: "ci(pc)"

  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 6
    cooldown:
      default-days: 3
    commit-message:
      prefix: "deps(android)"
    groups:
      android-minor-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    ignore:
      # Native FFmpeg binaries must match the exact Media3 API/ABI.
      - dependency-name: "androidx.media3:*"
      - dependency-name: "io.github.anilbeesetti:nextlib-media3ext"
