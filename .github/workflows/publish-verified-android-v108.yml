name: Publish signed FileHub Android v0.1.108 (verified)
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[ANDROID_BINARY_HANDOFF_20261122_V108]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Verify publisher-signed Android v0.1.108 APK checksum
        shell: bash
        run: |
          set -euo pipefail
          curl --http1.1 --fail --location --retry 6 --retry-all-errors \
            --retry-delay 3 --connect-timeout 15 --max-time 850 \
            'https://can-raymond-agencies-listing.trycloudflare.com/FileHub-AIO-v0.1.108.apk' -o FileHub-AIO-v0.1.108.apk
          test "$(stat -c '%s' FileHub-AIO-v0.1.108.apk)" -eq 72615361
          echo '61F006F0CBF212AD20281481D1DBFCE30CDF1D000171CEFF224272AA53557ACE  FileHub-AIO-v0.1.108.apk' | sha256sum -c -
          unzip -Z1 FileHub-AIO-v0.1.108.apk | grep -Fx AndroidManifest.xml
          echo 'ANDROID_V108_SIGNED_APK_SHA256_PASS'
      - name: Publish official Android v0.1.108 OTA GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.1.108 >/dev/null 2>&1; then
            echo 'Release already exists; refusing unsafe asset overwrite'
            exit 1
          fi
          gh release create v0.1.108 FileHub-AIO-v0.1.108.apk \
            --target "$GITHUB_SHA" --latest \
            --title 'FileHub AIO Android v0.1.108' \
            --notes $'versionCode: 109\n\n- Fixed first-use SFTP SSH host key verification being wrapped in a generic TransportException. New servers show explicit SHA256 fingerprint approval instead of hiding it in a transport error. Changed/pinned host keys remain blocked.\n- Modern Steam Deck/OpenSSH Ed25519 host keys receive Android Conscrypt-compatible strict SSH public key fingerprint encoding. No permissive SSH host verifier or automatic trust was introduced.\n- Improved error messages for SSH host keys, unsupported algorithms and SFTP authentication; corrected NAS Mount dialog caption to FileHub AIO.\n- 560 Android unit tests passed, including first connection, changed-key rejection, EdDSA provider wrapper and RSA regression.\n- Existing TeraBox, MYBOX, WebDAV, FTPS, SFTP charset and Windows-compatible settings backup remain in place.\n- The actual Steam Deck still requires device-side validation.\n- VersionCode 109, original signing certificate unchanged.\n- SHA256 61F006F0CBF212AD20281481D1DBFCE30CDF1D000171CEFF224272AA53557ACE'
          gh release view v0.1.108 --json tagName,url,assets
          echo 'ANDROID_V0_1_108_OFFICIAL_GITHUB_RELEASE_SUCCESS'
