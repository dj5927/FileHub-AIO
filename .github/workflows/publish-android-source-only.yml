name: Publish verified Android source only
on:
  push:
    branches: [maintenance/android-ota-retire-public]
    paths: ['.github/workflows/publish-android-source-only.yml']
permissions:
  contents: write
jobs:
  source:
    if: github.repository == 'dj5927/FileHub-AIO'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android/play
          fetch-depth: 1
      - name: Verify and import exact source snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "FileHub source publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false
          archive="$RUNNER_TEMP/filehub-source.zip"
          staging="$RUNNER_TEMP/filehub-source"
          curl --fail --location --retry 3 --connect-timeout 15 --user-agent 'FileHub-AIO-Android-OTA' 'https://bangtanrun.com/filehub/FileHub-AIO-Direct-v0.1.143-source.zip' --output "$archive"
          echo '570dc4dfa09d3ddba99cf8410b3c0d65c5f27367f35d57644e2447e45fc36cd5  '"$archive" | sha256sum -c -
          mkdir "$staging"
          unzip -q "$archive" -d "$staging"
          test -f "$staging/app/build.gradle"
          test -f "$staging/LICENSE"
          test -z "$(find "$staging" -type f \( -iname '*.apk' -o -iname '*.aab' -o -iname '*.jks' -o -iname '*.p12' -o -iname '*.keystore' -o -name 'access.key' \) -print)"
          test ! -d "$staging/.github/release-handoffs"
          test ! -d "$staging/release-assets"
          git switch -c android/flutter-migration
          rsync -a --delete --exclude='/.git/' "$staging/" ./
          git add -A
          git diff --cached --exit-code -- .github/workflows
          tree="$(git write-tree)"
          test "$tree" = '86fe57f538dda3cd0b7e638fdfc7ae9c467fb9c5'
          git commit -m 'Publish Android v0.1.143 and Play v1.0.27 source; private Direct OTA only'
          git push origin HEAD:refs/heads/android/flutter-migration
          echo "Source tree $tree published; no APK or AAB release created."
