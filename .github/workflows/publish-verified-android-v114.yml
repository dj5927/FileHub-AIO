name: Publish verified signed FileHub Android v0.1.114
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[ANDROID_BINARY_HANDOFF_20261123_V114]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download publisher-signed APK and verify immutable bytes
        shell: bash
        run: |
          set -euo pipefail
          curl --http1.1 --fail --location --retry 6 --retry-all-errors --retry-delay 4 --connect-timeout 15 --max-time 850 'https://teacher-nation-window-labour.trycloudflare.com/FileHub-AIO-v0.1.114.apk' -o FileHub-AIO-v0.1.114.apk
          test "$(stat -c '%s' FileHub-AIO-v0.1.114.apk)" -eq 72631889
          echo 'A27758AD2EBF517C4FCE91245731915E2FAAA34838814EBCEEB3EFF45A48F975  FileHub-AIO-v0.1.114.apk' | sha256sum -c -
          unzip -tqq FileHub-AIO-v0.1.114.apk
          unzip -Z1 FileHub-AIO-v0.1.114.apk | grep -Fx AndroidManifest.xml
          unzip -Z1 FileHub-AIO-v0.1.114.apk | grep -Fx classes.dex
          unzip -Z1 FileHub-AIO-v0.1.114.apk | grep -Fx assets/office_hwp/office-host.js
          printf '%s\n' 'A27758AD2EBF517C4FCE91245731915E2FAAA34838814EBCEEB3EFF45A48F975  FileHub-AIO-v0.1.114.apk' > SHA256SUMS
          echo 'ANDROID_V114_SIGNED_ZIP_VERIFIED'
      - name: Publish signed Android OTA v0.1.114
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.1.114 >/dev/null 2>&1; then
            echo 'Android v0.1.114 already published; refusing overwrite'
            exit 1
          fi
          gh release create v0.1.114 FileHub-AIO-v0.1.114.apk SHA256SUMS --target "$GITHUB_SHA" --latest --title 'FileHub AIO Android v0.1.114' --notes 'versionCode: 115

          - WebDAV Excel .xlsx/.xls now checks both Microsoft Excel ~$ owner-file variants before editing.
          - If another PC, RaiDrive or Android editor owns the file, open read-only with Save disabled.
          - New Android edits create a conditional server-side Excel-shaped ~$ owner, which only this editor may conditionally delete on normal close.
          - Preserve original strong WebDAV ETag from initial open and check before every commit; reject changed originals instead of silently overwriting.
          - No automatic deletion of crash-left owner files; manual removal only after all editors close.
          - Built-in and external Android Office editors covered; other providers and Windows PC version unchanged.
          - Local Android unit tests 586 passed (8 new Excel owner tests), GitHub Actions test/debug build passed.
          - Signed with the same APK publisher certificate as official v0.1.113, checked via Android apksigner.
          - Real RaiDrive + Android simultaneous editor testing on the user NAS is still required.
          - SHA256 A27758AD2EBF517C4FCE91245731915E2FAAA34838814EBCEEB3EFF45A48F975.'
          gh release view v0.1.114 --json tagName,url,assets
          echo 'ANDROID_V114_OFFICIAL_RELEASE_SUCCESS'
