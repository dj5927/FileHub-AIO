name: Publish signed FileHub AIO OTA release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish:
    # v0.1.105 is a one-time publisher-signed binary handoff with its own
    # checksum-verified workflow. Do not run the older staging-branch
    # publisher against this tag (that branch is intentionally absent).
    if: github.ref_name != 'v0.1.105' && github.ref_name != 'v0.1.106' && github.ref_name != 'v0.1.107' && github.ref_name != 'v0.1.108' && github.ref_name != 'v0.1.109' && github.ref_name != 'v0.1.110' && github.ref_name != 'v0.1.111'
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged, already-signed APK
        uses: actions/checkout@v4
        with:
          ref: release-staging/${{ github.ref_name }}
          path: staging
          persist-credentials: false

      - name: Verify staged APK integrity and release metadata
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          file="staging/release-assets/FileHub-AIO-${tag}.apk"
          test -f "${file}"
          test -f staging/release-assets/SHA256SUMS
          test -f staging/release-assets/versionCode.txt
          (cd staging/release-assets && sha256sum --check SHA256SUMS)
          version_code="$(cat staging/release-assets/versionCode.txt)"
          [[ "${version_code}" =~ ^[0-9]+$ ]]
          test "$(stat -c '%s' "${file}")" -gt 1000000
          {
            printf 'versionCode: %s\n\n' "${version_code}"
            if test -f staging/release-assets/RELEASE_NOTES.md; then
              cat staging/release-assets/RELEASE_NOTES.md
            else
              printf '## 수정 사항\n- 일반 안정성 개선\n'
            fi
          } > release-notes.txt

      - name: Create or refresh public GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          apk="staging/release-assets/FileHub-AIO-${tag}.apk"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${apk}" --clobber
            gh release edit "${tag}" --notes-file release-notes.txt --latest
          else
            gh release create "${tag}" "${apk}" --verify-tag --latest \
              --title "FileHub AIO ${tag}" --notes-file release-notes.txt
          fi
          gh release view "${tag}" --json url,assets,tagName
