name: Publish verified FileHub PC v1.3.143 Excel SaveAs and aligned icons
on:
  push:
    branches: [pc/windows]
permissions:
  contents: write
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[PC_V143_BINARY_HANDOFF_20261124]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified package from previous published release
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 "https://github.com/dj5927/FileHub-AIO/releases/download/pc-v1.3.142/FileHub-AIO-PC-1.3.142-win-x64.zip" -o base-v142.zip
          python3 .github/release-handoffs/reconstruct_pc143.py base-v142.zip .github/release-handoffs/pc-v143-handoff.zip FileHub-AIO-PC-1.3.143-win-x64.zip
          sha256sum FileHub-AIO-PC-1.3.143-win-x64.zip > SHA256SUMS
          unzip -tqq FileHub-AIO-PC-1.3.143-win-x64.zip
      - name: Publish Windows PC-only OTA release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view pc-v1.3.143 >/dev/null 2>&1; then
            echo 'Refusing to replace existing PC v1.3.143 release'
            exit 1
          fi
          cat > notes.txt <<'NOTES'
          FileHub AIO PC v1.3.143 - Excel SaveAs reopen fix and icon alignment

          - Fix post-MOVE write-open when the final workbook lacks an ETag. Retain real Excel owner checks, previous-byte checks, and ordinary-file strong ETag protection.
          - Real Excel isolated tests passed: first save, five repeated saves, NAS-to-NAS SaveAs, reopen/save, Korean filename, 3.9 MB workbook, pre-existing empty target, original file preservation and independent second-mount lock conflict.
          - Align icon and Korean caption visible centers in settings and context menus. Six settings buttons measured within 0.5 pixel at 100 percent DPI.
          - All 323 files reconstructed and individually SHA-256 verified against the tested publisher package. Production NAS retest remains required. Transfer timing work remains separate.
          NOTES
          printf '\nArchive SHA256: %s\n' "$(cut -d ' ' -f 1 SHA256SUMS)" >> notes.txt
          gh release create pc-v1.3.143 FileHub-AIO-PC-1.3.143-win-x64.zip SHA256SUMS --target "$GITHUB_SHA" --latest=false --title 'FileHub AIO PC v1.3.143' --notes-file notes.txt
          gh release view pc-v1.3.143 --json tagName,url,assets > release.json
          python3 - <<'PY'
          import hashlib, json, pathlib
          r=json.load(open('release.json',encoding='utf-8'))
          assert r['tagName']=='pc-v1.3.143'
          f=pathlib.Path('FileHub-AIO-PC-1.3.143-win-x64.zip')
          a=next(x for x in r['assets'] if x['name']==f.name)
          assert a['size']==f.stat().st_size
          with f.open('rb') as stream:
              digest=hashlib.file_digest(stream,'sha256').hexdigest()
          assert a.get('digest','').lower()=='sha256:'+digest
          print('PC143_OFFICIAL_RELEASE_SUCCESS',digest)
          PY
