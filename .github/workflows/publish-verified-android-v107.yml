name: Publish signed FileHub Android v0.1.107 (verified)
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[ANDROID_BINARY_HANDOFF_20261121_V107]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download and SHA-256 verify publisher-signed v0.1.107 APK
        shell: bash
        run: |
          set -euo pipefail
          curl --http1.1 --fail --location --retry 6 --retry-all-errors \
            --retry-delay 3 --connect-timeout 15 --max-time 850 \
            'https://documented-jean-fields-approx.trycloudflare.com/FileHub-AIO-v0.1.107.apk' -o FileHub-AIO-v0.1.107.apk
          test "$(stat -c '%s' FileHub-AIO-v0.1.107.apk)" -eq 72615365
          echo 'F23BF639BA1A7C2E28221252A0D18B719DE33829C077D62A060170F5CB0351B1  FileHub-AIO-v0.1.107.apk' | sha256sum -c -
          unzip -Z1 FileHub-AIO-v0.1.107.apk | grep -Fx AndroidManifest.xml
          echo 'ANDROID_V107_PUBLISHER_SIGNED_APK_CHECKSUM_VERIFIED'
      - name: Publish official GitHub OTA latest v0.1.107
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.1.107 >/dev/null 2>&1; then
            echo 'Android v0.1.107 release already exists; refusing overwrite'
            exit 1
          fi
          gh release create v0.1.107 FileHub-AIO-v0.1.107.apk \
            --target "$GITHUB_SHA" --latest \
            --title 'FileHub AIO Android v0.1.107' \
            --notes $'versionCode: 108\n\n- Removed the unusable TeraBox Google-in-Chrome button. Embedded TeraBox web login and manual ndus help remain.\n- MYBOX connection dialog includes compact PAT 발급 방법 help matching Windows FileHub instructions.\n- SFTP now offers selectable filename encodings (UTF-8, CP949, EUC-KR, Japanese and Chinese legacy encodings). SSHJ sends and decodes paths using the chosen remote charset.\n- WebDAV native optional RFC4918 LOCK/UNLOCK during existing-document saves, with server lock token and strong ETag in destination-tagged conditional MOVE; safe fallback to ETag when LOCK unsupported. Prevents blind overwrite when neither guard is available. This is not an Office open-file lock held for the full editing session.\n- 555 Android unit tests passed including WebDAV lock/mock-server and SFTP charset tests; existing publisher signing certificate unchanged, versionCode 108.\n- Google Drive and OneDrive remain excluded from Android. PC v1.3.128 unchanged.\n- SHA256 F23BF639BA1A7C2E28221252A0D18B719DE33829C077D62A060170F5CB0351B1'
          gh release view v0.1.107 --json tagName,url,assets
          echo 'ANDROID_V0_1_107_OFFICIAL_GITHUB_RELEASE_SUCCESS'
