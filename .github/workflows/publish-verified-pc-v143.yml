name: Publish verified FileHub PC v1.3.143 Excel SaveAs and aligned icons
on:
  push:
    branches: [pc/windows]
permissions:
  contents: write
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[PC_V143_BINARY_HANDOFF_20261124]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download, reassemble and verify Windows publisher archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures, pathlib, time, urllib.request
          base = "https://museum-grass-watching-tutorials.trycloudflare.com/"
          def part(index):
              name = f"pc-v143-part{index:02}"
              total = 16777216 if index < 10 else 1466642
              with pathlib.Path(name).open("wb") as out:
                  for start in range(0, total, 1048576):
                      end = min(total - 1, start + 1048575)
                      for attempt in range(10):
                          try:
                              req = urllib.request.Request(base+name, headers={
                                  "Range":f"bytes={start}-{end}",
                                  "Accept-Encoding":"identity"})
                              with urllib.request.urlopen(req, timeout=30) as r:
                                  data = r.read()
                                  if r.status != 206 or r.headers.get("Content-Range") != f"bytes {start}-{end}/{total}" or len(data) != end-start+1:
                                      raise IOError("wrong range or length")
                              out.write(data)
                              break
                          except Exception as e:
                              if attempt == 9:
                                  raise
                              print(name, start, "retry", attempt+1, type(e).__name__, flush=True)
                              time.sleep(min(3, attempt+1))
              assert pathlib.Path(name).stat().st_size == total
              print(f"PC143_PART_{index:02}_READY", flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              list(pool.map(part, range(11)))
          PY
          cat pc-v143-part{00..10} > FileHub-AIO-PC-1.3.143-win-x64.zip
          test "$(stat -c '%s' FileHub-AIO-PC-1.3.143-win-x64.zip)" -eq 169238802
          echo '841E4EB2881270EFC524C9635E6DB30E2963285DA7E49FEC94CF29A4607F30AB  FileHub-AIO-PC-1.3.143-win-x64.zip' | sha256sum -c -
          unzip -tqq FileHub-AIO-PC-1.3.143-win-x64.zip
          for file in FileHubAIO.exe tools/NASMountLockBridge.exe tools/rclone.exe tools/google-oauth-desktop.json README_PC_V143_SAVEAS_ALIGNMENT_KR.md RAIDRIVE_2026_10_COMPARATIVE_RESEARCH.md; do
            unzip -Z1 FileHub-AIO-PC-1.3.143-win-x64.zip | grep -Fx "$file"
          done
          printf '%s\n' '841E4EB2881270EFC524C9635E6DB30E2963285DA7E49FEC94CF29A4607F30AB  FileHub-AIO-PC-1.3.143-win-x64.zip' > SHA256SUMS
          echo 'PC143_VERIFIED_ARCHIVE_SUCCESS'
      - name: Publish Windows PC-only OTA release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view pc-v1.3.143 >/dev/null 2>&1; then
            echo 'Refusing to replace existing PC v1.3.143 release'
            exit 1
          fi
          cat > notes.txt <<'NOTES'
          FileHub AIO PC v1.3.143 - Excel SaveAs reopen fix and icon alignment

          - Fix the post-MOVE Excel write-open failure when the final workbook also lacks an ETag. Guard unversioned Office saves with verified ownership and previous-byte checks. Keep ordinary-file strong ETag protection.
          - Real Excel isolated tests: first save, five repeated saves, NAS-to-NAS SaveAs, reopen and save, Korean filename, 3.9 MB workbook, pre-existing zero-byte target, source preservation, and independent second-mount lock conflict all passed.
          - Align icon and Korean caption visible centers in settings and right-click menus. Six settings buttons measured within 0.5 pixel at 100 percent DPI.
          - Production NAS retest remains required. Ordinary transfer timing work remains separate.
          - SHA256: 841E4EB2881270EFC524C9635E6DB30E2963285DA7E49FEC94CF29A4607F30AB
          NOTES
          gh release create pc-v1.3.143 FileHub-AIO-PC-1.3.143-win-x64.zip SHA256SUMS --target "$GITHUB_SHA" --latest=false --title 'FileHub AIO PC v1.3.143' --notes-file notes.txt
          gh release view pc-v1.3.143 --json tagName,url,assets > release.json
          python3 - <<'PY'
          import json
          r=json.load(open('release.json',encoding='utf-8'))
          assert r['tagName']=='pc-v1.3.143'
          a=next(x for x in r['assets'] if x['name']=='FileHub-AIO-PC-1.3.143-win-x64.zip')
          assert a['size']==169238802
          assert a.get('digest','').lower()=='sha256:841e4eb2881270efc524c9635e6db30e2963285da7e49fec94cf29a4607f30ab'
          print('PC143_OFFICIAL_RELEASE_SUCCESS')
          PY
