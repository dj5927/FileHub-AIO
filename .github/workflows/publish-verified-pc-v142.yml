name: Publish verified FileHub PC v1.3.142 Office MOVE 412 and compact menus
on:
  push:
    branches: [pc/windows]
permissions:
  contents: write
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[PC_V142_BINARY_HANDOFF_20261124]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download, reassemble and verify Windows publisher archive
        shell: bash
        run: |
          set -euo pipefail
          for i in {00..10}; do
            curl --http1.1 --fail --location --retry 7 --retry-all-errors --retry-delay 3 --connect-timeout 15 --max-time 330 "https://description-permission-prepared-plane.trycloudflare.com/pc-v142-part${i}" -o "pc-v142-part${i}"
            test -s "pc-v142-part${i}"
            echo "PC142_PART_${i}_READY"
          done
          cat pc-v142-part{00..10} > FileHub-AIO-PC-1.3.142-win-x64.zip
          test "$(stat -c '%s' FileHub-AIO-PC-1.3.142-win-x64.zip)" -eq 169220138
          echo 'FD9B3724FAD56CB5D7A5D6886D5CCA01380BD8415256A739153CE7DA6302566A  FileHub-AIO-PC-1.3.142-win-x64.zip' | sha256sum -c -
          unzip -tqq FileHub-AIO-PC-1.3.142-win-x64.zip
          for file in FileHubAIO.exe tools/NASMountLockBridge.exe tools/rclone.exe tools/google-oauth-desktop.json README_PC_V142_MENU_SAVE_FIX_KR.md RAIDRIVE_2026_10_COMPARATIVE_RESEARCH.md; do
            unzip -Z1 FileHub-AIO-PC-1.3.142-win-x64.zip | grep -Fx "$file"
          done
          printf '%s\n' 'FD9B3724FAD56CB5D7A5D6886D5CCA01380BD8415256A739153CE7DA6302566A  FileHub-AIO-PC-1.3.142-win-x64.zip' > SHA256SUMS
          echo 'PC142_VERIFIED_ARCHIVE_SUCCESS'
      - name: Publish Windows PC-only OTA release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view pc-v1.3.142 >/dev/null 2>&1; then
            echo 'Refusing to replace existing PC v1.3.142 release'
            exit 1
          fi
          cat > notes.txt <<'NOTES'
          FileHub AIO PC v1.3.142 - Office MOVE HTTP 412 fix and simplified menus

          - Reproduce v141 failure with real Excel against a WebDAV server rejecting conditional unversioned MOVE requests. Use verified Overwrite:F with source and destination SHA-256 checks for same-mount Office temporary files.
          - First save, five subsequent saves, and local-to-NAS Korean filename SaveAs passed in the isolated rejection lab. Existing owner-file locking and conditional target overwrites remain intact.
          - Remove requested redundant diagnostics and manual recovery actions. Group remaining settings using line icons; Synology sharing is available only from NAS connection context menus. Eight provider menus and focused layout tests passed.
          - Actual production NAS retest remains required. Ordinary transfer timing remains a separate investigation.
          - SHA256: FD9B3724FAD56CB5D7A5D6886D5CCA01380BD8415256A739153CE7DA6302566A
          NOTES
          gh release create pc-v1.3.142 FileHub-AIO-PC-1.3.142-win-x64.zip SHA256SUMS --target "$GITHUB_SHA" --latest=false --title 'FileHub AIO PC v1.3.142' --notes-file notes.txt
          gh release view pc-v1.3.142 --json tagName,url,assets > release.json
          python3 - <<'PY'
          import json
          r=json.load(open('release.json',encoding='utf-8'))
          assert r['tagName']=='pc-v1.3.142'
          a=next(x for x in r['assets'] if x['name']=='FileHub-AIO-PC-1.3.142-win-x64.zip')
          assert a['size']==169220138
          assert a.get('digest','').lower()=='sha256:fd9b3724fad56cb5d7a5d6886d5cca01380bd8415256a739153ce7da6302566a'
          print('PC142_OFFICIAL_RELEASE_SUCCESS')
          PY
