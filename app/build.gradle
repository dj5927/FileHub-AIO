plugins {
    id 'com.android.application'
}

// Office renderer WASM binaries are stored as losslessly compressed chunks in
// app/office-assets. Fresh public Git clones reconstruct them before Android
// asset packaging, avoiding GitHub's per-request upload limits. Neither the
// signing credentials nor any user configuration are part of these chunks.
def officeAssetBundles = [
    [file: 'canvaskit-SCAxUyCS.wasm', count: 2,
     sha256: '25EBED8E60158C5854F8DC807B936DACA21354F8BFB6A2231266B0A93812F301'],
    [file: 'rhwp_bg-CjDYAjgF.wasm', count: 6,
     sha256: 'E2E56DFD387FFEE5B0995D23E4A0086001407F12A045820EB61BD6A506C9ABC1']
]

tasks.register('restoreBundledOfficeAssets') {
    doLast {
        officeAssetBundles.each { bundle ->
            def output = file('src/main/assets/office_hwp/assets/' + bundle.file)
            def checksum = { File input ->
                def md = java.security.MessageDigest.getInstance('SHA-256')
                input.withInputStream { stream ->
                    byte[] buffer = new byte[65536]
                    int count
                    while ((count = stream.read(buffer)) >= 0)
                        if (count > 0) md.update(buffer, 0, count)
                }
                return md.digest().encodeHex().toString().toUpperCase(java.util.Locale.ROOT)
            }
            if (output.isFile() && checksum(output) == bundle.sha256) return
            def pieces = (0..<bundle.count).collect { index ->
                file('office-assets/' + bundle.file + '.gz.part' + String.format('%02d', index))
            }
            if (pieces.any { !it.isFile() })
                throw new GradleException('Office asset chunks missing: ' + bundle.file)
            output.parentFile.mkdirs()
            def temp = file("${buildDir}/tmp/office-restore/${bundle.file}")
            temp.parentFile.mkdirs()
            def streams = pieces.collect { new FileInputStream(it) }
            def concat = new java.io.SequenceInputStream(java.util.Collections.enumeration(streams))
            try {
                new java.util.zip.GZIPInputStream(concat).withCloseable { inflated ->
                    temp.withOutputStream { destination ->
                        byte[] buffer = new byte[65536]
                        int count
                        while ((count = inflated.read(buffer)) >= 0)
                            if (count > 0) destination.write(buffer, 0, count)
                    }
                }
            } finally { concat.close() }
            if (checksum(temp) != bundle.sha256)
                throw new GradleException('Office asset SHA256 mismatch: ' + bundle.file)
            java.nio.file.Files.move(temp.toPath(), output.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}
tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn tasks.named('restoreBundledOfficeAssets')
}

def releaseSigning = new Properties()
// Local publisher builds may specify an existing private signing file from
// a different checkout. This property never copies the private keystore or
// passwords into the source repository or its published assets.
def releaseSigningFile = rootProject.file(
        providers.gradleProperty('filehubReleaseSigningConfig')
                .getOrElse('../signing/signing.properties'))
if (releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { stream -> releaseSigning.load(stream) }
}

// Play monetization is isolated from Direct. Public identifiers are supplied
// by the publisher outside source control. Unconfigured release builds never
// request live or demo ads. Debug builds use Google's dedicated demo units.
def adApp = providers.gradleProperty('filehubAdMobAppId').getOrElse('')
def adBanner = providers.gradleProperty('filehubAdMobBannerId').getOrElse('')
def adInterstitial = providers.gradleProperty('filehubAdMobInterstitialId').getOrElse('')
def billingKey = providers.gradleProperty('filehubPlayBillingPublicKey').getOrElse('')
def privacyPolicyUrl = providers.gradleProperty('filehubPrivacyPolicyUrl').getOrElse('').trim()
def privacyUrlValid = {
    if (!privacyPolicyUrl) return false
    try {
        def uri = new java.net.URI(privacyPolicyUrl)
        return 'https'.equalsIgnoreCase(uri.scheme) && uri.host != null &&
                uri.userInfo == null && uri.host.contains('.')
    } catch (java.net.URISyntaxException ignored) {
        return false
    }
}
if (privacyPolicyUrl && !privacyUrlValid())
    throw new GradleException('Privacy policy URL must be an HTTPS URL without embedded credentials')
// An upload-signed bundle must explicitly be an internal test or a production
// build. Default bundlePlayRelease remains an unsigned development candidate.
// Local private distribution key; never checked into the public source tree.
def directOtaKeyFile = providers.gradleProperty('filehubDirectOtaKeyFile').orElse('').get()
def directOtaKey = directOtaKeyFile ? file(directOtaKeyFile).getText('UTF-8').trim() : ''
if (directOtaKey && !(directOtaKey ==~ /[A-Za-z0-9_-]{32,128}/))
    throw new GradleException('Invalid private OTA key')
def playInternal = providers.gradleProperty('filehubPlayInternalTest').getOrElse('false') == 'true'
def playProduction = providers.gradleProperty('filehubPlayProduction').getOrElse('false') == 'true'
// The Room/R8 startup fix is confirmed. All Play release candidates now
// use R8 and resource shrinking. Reject obsolete diagnostic switches.
if (providers.gradleProperty('filehubPlayDiagnosticNoR8').getOrElse('false') == 'true' ||
        providers.gradleProperty('filehubPlayR8Trial').getOrElse('false') == 'true')
    throw new GradleException('Obsolete Play diagnostic build; use the standard optimized release')
if (playInternal && playProduction)
    throw new GradleException('Choose exactly one Play distribution mode')
// This branch is an incremental migration, never a production Play build.
if (playProduction)
    throw new GradleException('Flutter migration requires device parity before production publication')
def liveAds = [adApp, adBanner, adInterstitial].every { it != '' } &&
        (adApp ==~ /ca-app-pub-\d{16}~\d{10}/) &&
        ([adBanner, adInterstitial].every { it ==~ /ca-app-pub-\d{16}\/\d{10}/ }) &&
        ![adApp,adBanner,adInterstitial].any { it.startsWith('ca-app-pub-3940256099942544') } &&
        adBanner != adInterstitial &&
        [adBanner,adInterstitial].every { it.split('/')[0] == adApp.split('~')[0] }
if (billingKey && !(billingKey ==~ /[A-Za-z0-9+\/=]+/))
    throw new GradleException('Invalid Play billing public key format')
def playSigningFile = rootProject.file(
        providers.gradleProperty('filehubPlayReleaseSigningConfig')
                .getOrElse('../signing/play-signing.properties'))
def playSigning = new Properties()
if (playSigningFile.exists())
    playSigningFile.withInputStream { stream -> playSigning.load(stream) }

tasks.register('verifyPlayUploadSigning') {
    doLast {
        if (!playSigningFile.isFile() ||
                !['storeFile','storePassword','keyAlias','keyPassword'].every { playSigning.getProperty(it) })
            throw new GradleException('Configure independent Play upload signing key')
        if (playSigningFile.canonicalFile == releaseSigningFile.canonicalFile)
            throw new GradleException('Do not reuse the Direct signing configuration')
        if (!file(playSigning.getProperty('storeFile')).isFile())
            throw new GradleException('Play upload keystore not found')
        if (releaseSigning.getProperty('storeFile') &&
                file(playSigning.getProperty('storeFile')).canonicalFile ==
                file(releaseSigning.getProperty('storeFile')).canonicalFile)
            throw new GradleException('Do not reuse the Direct keystore')
        println 'PLAY_INDEPENDENT_UPLOAD_SIGNING_CONFIGURATION_PASS'
    }
}
tasks.register('verifyPlayProductionConfiguration') {
    dependsOn tasks.named('verifyPlayUploadSigning')
    doLast {
        if (!liveAds) throw new GradleException('Configure production AdMob app/banner/interstitial IDs')
        if (!billingKey) throw new GradleException('Configure the Play app licensing public key')
        if (!privacyUrlValid()) throw new GradleException('Configure the public HTTPS privacy policy URL')
        try {
            java.security.KeyFactory.getInstance('RSA').generatePublic(
                    new java.security.spec.X509EncodedKeySpec(java.util.Base64.decoder.decode(billingKey)))
        } catch (Exception ignored) {
            throw new GradleException('Invalid Play app licensing public key')
        }
        println 'PLAY_PRODUCTION_CONFIGURATION_PASS'
    }
}
tasks.matching { it.name == 'prePlayReleaseBuild' }.configureEach {
    if (playProduction) dependsOn tasks.named('verifyPlayProductionConfiguration')
    else if (playInternal) dependsOn tasks.named('verifyPlayUploadSigning')
}

android {
    namespace 'com.nasmount.mobile'
    // AndroidX Core 1.19.1 and OkHttp Android 5.5.1 require API 37
    // at compile time. Keep targetSdk 35 until behavior-change testing.
    compileSdk 37

    defaultConfig {
        minSdk 26
        targetSdk 35
        ndk {
            def selectedAbi=providers.gradleProperty('filehubTestAbi').getOrElse('')
            if(selectedAbi && !['armeabi-v7a','arm64-v8a','x86_64'].contains(selectedAbi))
                throw new GradleException('Unsupported test ABI')
            abiFilters.addAll(selectedAbi ? [selectedAbi] : ['armeabi-v7a','arm64-v8a','x86_64'])
        }
    }
    signingConfigs {
        playUpload {
            if (playSigningFile.exists()) {
                storeFile file(playSigning.getProperty('storeFile'))
                storePassword playSigning.getProperty('storePassword')
                keyAlias playSigning.getProperty('keyAlias')
                keyPassword playSigning.getProperty('keyPassword')
            }
        }
        release {
            if (releaseSigningFile.exists()) {
                storeFile file(releaseSigning.getProperty('storeFile'))
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
            }
        }
    }
    buildFeatures { buildConfig = true }
    // Manual in-app language switching must work without downloading a language split.
    bundle {
        language { enableSplit = false }
    }
    flavorDimensions += 'distribution'
    productFlavors {
        direct {
            dimension 'distribution'
            applicationId 'com.nasmount.mobile'
            targetSdk 35
            versionCode 147
            versionName '0.1.146'
            buildConfigField 'boolean', 'DIRECT_EDITION', 'true'
            buildConfigField 'String', 'DIRECT_OTA_KEY', groovy.json.JsonOutput.toJson(directOtaKey)
            buildConfigField 'boolean', 'R8_TRIAL', 'false'
            buildConfigField 'String', 'PAIR_SCHEME', '"filehubaio"'
            manifestPlaceholders = [pairScheme: 'filehubaio']
            if (releaseSigningFile.exists()) signingConfig signingConfigs.release
        }
        play {
            dimension 'distribution'
            applicationId 'com.filehubaio.mobile'
            targetSdk 36
            versionCode 30
            versionName '1.0.29'
            buildConfigField 'boolean', 'DIRECT_EDITION', 'false'
            buildConfigField 'boolean', 'R8_TRIAL', 'false'
            buildConfigField 'String', 'PAIR_SCHEME', '"filehubaio-play"'
            buildConfigField 'boolean', 'PLAY_INTERNAL_TEST', playInternal.toString()
            buildConfigField 'boolean', 'LIVE_ADS_CONFIGURED', (playProduction && liveAds).toString()
            buildConfigField 'String', 'AD_BANNER_ID', '"' + (playProduction && liveAds ? adBanner : '') + '"'
            buildConfigField 'String', 'AD_INTERSTITIAL_ID', '"' + (playProduction && liveAds ? adInterstitial : '') + '"'
            buildConfigField 'String', 'PLAY_BILLING_PUBLIC_KEY', '"' + billingKey + '"'
            buildConfigField 'String', 'PRIVACY_POLICY_URL', groovy.json.JsonOutput.toJson(privacyPolicyUrl)
            manifestPlaceholders = [pairScheme: 'filehubaio-play',
                adMobAppId: playProduction && liveAds ? adApp : 'ca-app-pub-3940256099942544~3347511713']
            if ((playInternal || playProduction) && playSigningFile.exists())
                signingConfig signingConfigs.playUpload
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources {
            // Bouncy Castle 1.87 ships markdown license notices in each
            // of its three jars. Preserve all notices when packaging.
            merges += ['META-INF/LICENSE.md', 'META-INF/NOTICE.md']
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE',
                         'META-INF/LICENSE.txt', 'META-INF/NOTICE',
                         'META-INF/NOTICE.txt', 'META-INF/*.kotlin_module',
                         'META-INF/versions/**', 'META-INF/INDEX.LIST']
        }
    }
}

// Only the Play release is subject to the new Play DEX quality threshold.
// Keep the existing Direct release pipeline stable (including native codecs).
androidComponents {
    beforeVariants(selector().withBuildType('release')) { variant ->
        if (variant.productFlavors.any { it.first == 'distribution' && it.second == 'direct' }) {
            variant.shrinkResources = false
            variant.setMinifyEnabled(false)
        }
    }
}

dependencies {
    // One Dart UI module for both existing product flavors; Java remains
    // responsible for storage, viewers, signing and entitlement.
    debugImplementation 'com.filehubaio.filehub_flutter:flutter_debug:1.0'
    releaseImplementation 'com.filehubaio.filehub_flutter:flutter_release:1.0'
    // Official Maven Central ZXing; Dependabot can track the version.
    implementation 'com.google.zxing:core:3.5.4'
    def media3_version = '1.11.1'
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    // NextLib is built for this exact Media3 version. It bundles the FFmpeg
    // renderer + ABI-matched native codecs for AC3/EAC3/DTS/MLP/TrueHD/etc.
    // GPL-3.0: redistribution of this combined build requires compliance.
    directImplementation "io.github.anilbeesetti:nextlib-media3ext:1.11.1-0.19.0"
    playImplementation 'com.android.billingclient:billing:9.1.0'
    playImplementation 'com.google.android.gms:play-services-ads:25.5.0'
    playImplementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.core:core:1.19.1'
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'
    implementation 'commons-net:commons-net:3.13.0'
    implementation 'eu.agno3.jcifs:jcifs-ng:2.1.10'
    implementation 'com.hierynomus:sshj:0.41.2'
    // ZIP / 7z read-write; RAR extraction only (RAR encoding is proprietary).
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.tukaani:xz:1.12'
    directImplementation 'com.github.junrar:junrar:8.1.2'
    // Bring the already-transitive AndroidX/media utility graph onto verified
    // stable security/bugfix versions. Constraints do not add new modules.
    constraints {
        implementation('androidx.lifecycle:lifecycle-runtime:2.11.1') {
            because 'avoid old 2.10.0 inherited from AndroidX Core'
        }
        // Keep the three SSHJ crypto providers on the same reviewed release.
        // No change to SFTP authentication, host-key checks or algorithms.
        implementation('org.bouncycastle:bcprov-jdk18on:1.87') {
            because 'stable patch and security maintenance'
        }
        implementation('org.bouncycastle:bcpkix-jdk18on:1.87') {
            because 'match bcprov'
        }
        implementation('org.bouncycastle:bcutil-jdk18on:1.87') {
            because 'match bcprov and bcpkix'
        }
        implementation('androidx.exifinterface:exifinterface:1.4.2') {
            because 'fix JPEG/EXIF parsing problems in the 1.3.6 dependency'
        }
        implementation('org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0') {
            because 'align the transitive Android coroutines runtime'
        }
        implementation('org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0') {
            because 'align Android and core coroutine variants'
        }
    }
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:5.5.1'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
    testImplementation 'org.json:json:20260814'
}

apply from: 'license-notices.gradle'

// The release bundle is the source of truth for the Play code-quality scores.
// The explicit task also works for internal builds. Production packaging
// always runs the gate; a metadata or score regression fails the build.
def playBundleQuality = tasks.register('verifyPlayReleaseBundleQuality', Exec) {
    dependsOn 'bundlePlayRelease'
    workingDir rootProject.projectDir
    executable providers.gradleProperty('filehubPython').getOrElse('python')
    args 'scripts/verify_play_bundle_quality.py',
         'app/build/outputs/bundle/playRelease/app-play-release.aab'
}
if (playProduction) {
    tasks.matching { it.name == 'bundlePlayRelease' }.configureEach {
        finalizedBy playBundleQuality
    }
}
