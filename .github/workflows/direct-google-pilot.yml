name: Direct Google WinFsp pilot safety tests

on:
  push:
    branches:
      - pc/direct-google-pilot
      - pc/google-direct-stage-recovery-20261120
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: filehub-google-direct-pilot
  cancel-in-progress: true

jobs:
  google-direct:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out pilot branch
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build FileHub and direct WinFsp bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build NASMount.csproj -c Release -nologo
          if ($LASTEXITCODE -ne 0) { throw 'Main app failed to compile' }
          dotnet build LockBridge/LockBridge.csproj -c Release -nologo
          if ($LASTEXITCODE -ne 0) { throw 'Direct Google WinFsp bridge failed to compile' }
          $app = 'bin/Release/net10.0-windows/win-x64/FileHubAIO.exe'
          $out = & $app --google-direct-api-policy-test 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or
              $out -notmatch 'GOOGLE_DIRECT_DPAPI_OAUTH_ROUNDTRIP_AND_BACKUP_PASS' -or
              $out -notmatch 'GOOGLE_DIRECT_CRASH_JOURNAL_EXPORT_NO_OVERWRITE_PASS' -or
              $out -notmatch 'GOOGLE_DIRECT_API_RANGE_READ_AND_NEW_RESUMABLE_UPLOAD_PASS') {
            throw 'Direct Google API/DPAPI/PKCE policy failed: ' + $out
          }

      - name: Install pinned official WinFsp driver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi'
          $file = Join-Path $env:RUNNER_TEMP 'winfsp-2.1.25156.msi'
          Invoke-WebRequest -Uri $url -OutFile $file
          $actual = (Get-FileHash $file -Algorithm SHA256).Hash
          if ($actual -ne '073A70E00F77423E34BED98B86E600DEF93393BA5822204FAC57A29324DB9F7A') {
            throw 'Pinned WinFsp MSI hash mismatch'
          }
          $proc = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            '/i', ('"' + $file + '"'), '/qn', '/norestart', 'INSTALLLEVEL=1000')
          if ($proc.ExitCode -notin @(0,3010)) {
            throw ('WinFsp installation failed code=' + $proc.ExitCode)
          }
          $dll = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'WinFsp/bin/winfsp-x64.dll'
          if (!(Test-Path $dll)) { throw 'WinFsp x64 driver DLL missing' }

      - name: Real WinFsp native Google file operations over isolated fake API
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bridge = 'LockBridge/bin/Release/net10.0-windows/win-x64/NASMountLockBridge.exe'
          $output = & $bridge --direct-google-winfsp-policy-test 2>&1 | Out-String
          foreach ($required in @(
            'GOOGLE_DIRECT_WINFSP_REAL_WINDOWS_READ_PASS',
            'GOOGLE_DIRECT_WINFSP_OWNED_NETWORK_DRIVE_PASS',
            'GOOGLE_DIRECT_WINFSP_COALESCED_RANGE_READ_CACHE_PASS',
            'GOOGLE_DIRECT_WINFSP_REAL_WINDOWS_FOLDER_CREATE_RENAME_PASS',
            'GOOGLE_DIRECT_WINFSP_REAL_WINDOWS_NEW_FILE_UPLOAD_PASS',
            'GOOGLE_DIRECT_WINFSP_MULTIFLUSH_BEFORE_COMMIT_PASS',
            'GOOGLE_DIRECT_WINFSP_EXISTING_BINARY_EDIT_PIN_VERIFY_PASS',
            'GOOGLE_DIRECT_WINFSP_EXISTING_BINARY_REPEAT_SAVE_PASS',
            'GOOGLE_DIRECT_TWO_CLIENT_STALE_WRITE_RECOVERY_PASS',
            'GOOGLE_DIRECT_EXISTING_PIN_403_LOCAL_RECOVERY_PASS',
            'GOOGLE_DIRECT_WINFSP_REAL_WINDOWS_FILE_RENAME_TRASH_PASS',
            'GOOGLE_DIRECT_UPLOAD_403_FAILURE_PRESERVES_LOCAL_RECOVERY_PASS'
          )) {
            if ($output -notmatch $required) {
              throw ('Google WinFsp operation failed: ' + $required + ' ' + $output)
            }
          }
          if ($LASTEXITCODE -ne 0) { throw 'Google WinFsp native API test failed' }
          Write-Output $output

      - name: Package isolated Google direct pilot (not a stable release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Join-Path $env:RUNNER_TEMP 'FileHubGoogleDirectPilot'
          $bridge = Join-Path $env:RUNNER_TEMP 'FileHubGoogleDirectBridge'
          dotnet publish NASMount.csproj -c Release -r win-x64 --no-restore -o $app
          if ($LASTEXITCODE -ne 0) { throw 'Main app publish failed' }
          dotnet publish LockBridge/LockBridge.csproj -c Release -r win-x64 --no-restore -o $bridge
          if ($LASTEXITCODE -ne 0) { throw 'Bridge publish failed' }
          New-Item -ItemType Directory -Force -Path (Join-Path $app 'tools') | Out-Null
          Copy-Item -Recurse -Force (Join-Path $bridge '*') (Join-Path $app 'tools')
          # Existing WebDAV/FTP/SFTP/TeraBox and legacy Google profiles still
          # use rclone. The native Google pilot MUST preserve the complete
          # pinned backend toolset from the last verified stable PC release.
          # Never ship a partial ZIP with a GUI that cannot connect.
          $stable = Join-Path $env:RUNNER_TEMP 'FileHubPCStable126'
          New-Item -ItemType Directory -Force -Path $stable | Out-Null
          gh release download 'pc-v1.3.126' --repo 'dj5927/FileHub-AIO' `
            --pattern 'FileHub-AIO-PC-1.3.126-win-x64.zip' `
            --pattern 'SHA256SUMS' --dir $stable
          if ($LASTEXITCODE -ne 0) { throw 'Pinned stable PC backend download failed' }
          $archive = Join-Path $stable 'FileHub-AIO-PC-1.3.126-win-x64.zip'
          $sumFile = Join-Path $stable 'SHA256SUMS'
          if (!(Test-Path $archive) -or !(Test-Path $sumFile)) {
            throw 'Stable release ZIP or published checksum is missing'
          }
          $sumText = Get-Content $sumFile -Raw
          if ($sumText -notmatch '(?im)^([0-9A-F]{64})\s+FileHub-AIO-PC-1\.3\.126-win-x64\.zip\s*$') {
            throw 'Invalid stable release checksum manifest'
          }
          $expectedZipHash = $Matches[1]
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expectedZipHash) {
            throw 'Pinned stable release ZIP checksum mismatch'
          }
          $stableFiles = Join-Path $stable 'unpacked'
          Expand-Archive -Path $archive -DestinationPath $stableFiles -Force
          $stableTools = Join-Path $stableFiles 'tools'
          $required = @(
            'rclone.exe', 'rclone.sha256',
            'rclone-filehub-google.exe', 'rclone-filehub-google.sha256',
            'rclone-terabox.exe', 'rclone-terabox.sha256',
            'winfsp-2.1.25156.msi'
          )
          foreach ($name in $required) {
            $src = Join-Path $stableTools $name
            if (!(Test-Path $src)) { throw ('Stable release missing ' + $name) }
            Copy-Item $src (Join-Path (Join-Path $app 'tools') $name) -Force
          }
          foreach ($name in @('rclone.exe','rclone-filehub-google.exe','rclone-terabox.exe')) {
            $binary = Join-Path (Join-Path $app 'tools') $name
            $manifest = [IO.Path]::ChangeExtension($binary, '.sha256')
            $expected = ((Get-Content $manifest -Raw).Trim() -split '\s+')[0]
            if ((Get-FileHash $binary -Algorithm SHA256).Hash -ne $expected) {
              throw ('Bundled backend checksum mismatch: ' + $name)
            }
            $versionOutput = & $binary version 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0 -or $versionOutput -notmatch '^rclone v') {
              throw ('Bundled backend failed to start: ' + $name)
            }
          }
          if ((Get-FileHash (Join-Path $app 'tools/winfsp-2.1.25156.msi') `
              -Algorithm SHA256).Hash -ne '073A70E00F77423E34BED98B86E600DEF93393BA5822204FAC57A29324DB9F7A') {
            throw 'Pinned official WinFsp installer checksum mismatch'
          }
          Copy-Item GOOGLE_DIRECT_HANDOFF_20261120_KR.md (Join-Path $app 'PILOT_STATUS_KR.md')
          foreach ($item in (@('FileHubAIO.exe','tools/NASMountLockBridge.exe') +
              ($required | ForEach-Object { 'tools/' + $_ }))) {
            if (!(Test-Path (Join-Path $app $item))) {
              throw ('Direct pilot ZIP missing required component: ' + $item)
            }
          }
          $coldPolicy = & (Join-Path $app 'FileHubAIO.exe') --google-cold-start-policy-test 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or
              $coldPolicy -notmatch 'RCLONE_THREE_ENGINE_DISTINCT_MANIFEST_POLICY_PASS' -or
              $coldPolicy -notmatch 'GOOGLE_ASYNC_QUOTA_BUNDLED_BINARY_SHA256_PASS') {
            throw ('Packaged Google fallback integrity check failed: ' + $coldPolicy)
          }
          $route = & (Join-Path $app 'FileHubAIO.exe') --direct-webdav-routing-policy-test 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $route -notmatch 'DIRECT_WEBDAV_ONLY_PROVIDER_ROUTING_POLICY_PASS') {
            throw ('Packaged WebDAV routing check failed: ' + $route)
          }
          Write-Output 'GOOGLE_DIRECT_EXPERIMENTAL_COMPLETE_BACKENDS_PASS'
          $output = Join-Path $env:GITHUB_WORKSPACE 'FileHubAIO-GoogleDirect-EXPERIMENTAL.zip'
          Compress-Archive -Path (Join-Path $app '*') -DestinationPath $output -CompressionLevel Optimal
          $hash = (Get-FileHash $output -Algorithm SHA256).Hash
          Write-Output "EXPERIMENTAL_PILOT_ZIP_SHA256=$hash"

      - name: Upload experimental pilot artifact
        uses: actions/upload-artifact@v7
        with:
          name: FileHubAIO-PC-GoogleDirect-EXPERIMENTAL
          path: FileHubAIO-GoogleDirect-EXPERIMENTAL.zip
          if-no-files-found: error
          retention-days: 7
