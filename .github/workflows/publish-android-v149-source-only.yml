name: Publish Android v0.1.149 source only
on:
  push:
    branches: [maintenance/android-ota-retire-public]
    paths: ['.github/workflows/publish-android-v149-source-only.yml']
permissions:
  contents: write
jobs:
  source:
    if: github.repository == 'dj5927/FileHub-AIO'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android/flutter-migration
          fetch-depth: 1
      - name: Verify and fast-forward exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FileHub source publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false
          test "$(git rev-parse HEAD)" = '4098917de51f4a2989bdc44478e2ba3376b6a92b'
          archive="$RUNNER_TEMP/filehub-source.zip"
          staging="$RUNNER_TEMP/filehub-source"
          curl --fail --location --retry 3 --connect-timeout 15 --user-agent 'FileHub-AIO-Android-OTA' 'https://bangtanrun.com/filehub/FileHub-AIO-Direct-v0.1.149-source.zip' --output "$archive"
          echo '5a7721cc3514e074e714510fae1209f66d5a34a4e3a2f168756adf37572da0eb  '"$archive" | sha256sum -c -
          mkdir "$staging"
          unzip -q "$archive" -d "$staging"
          test -z "$(find "$staging" -type f \( -iname '*.apk' -o -iname '*.aab' -o -iname '*.jks' -o -iname '*.p12' -o -iname '*.keystore' -o -name 'access.key' \) -print)"
          test ! -d "$staging/.github/release-handoffs"
          test ! -d "$staging/release-assets"
          rsync -a --delete --exclude='/.git/' "$staging/" ./
          git add -A
          git diff --cached --exit-code -- .github/workflows
          tree="$(git write-tree)"
          test "$tree" = '0e119996187eb55c56e342b88b456d60900b0522'
          git commit -m 'Add Google Drive consent renewal; Direct 0.1.149 / Play 1.0.32'
          git push origin HEAD:refs/heads/android/flutter-migration
          echo "Source tree $tree published; no APK, AAB or tags created."
