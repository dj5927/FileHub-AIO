name: Publish verified FileHub PC v1.3.144 stable dependencies
on:
  push:
    branches: [pc/windows]
permissions:
  contents: write
jobs:
  reconstruct:
    if: contains(github.event.head_commit.message, '[PC_V144_BINARY_HANDOFF_20261124]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct the locally tested package
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 'https://github.com/dj5927/FileHub-AIO/releases/download/pc-v1.3.143/FileHub-AIO-PC-1.3.143-win-x64.zip' -o base.zip
          cat .github/release-handoffs/pc-v144.part* > handoff.zip
          sha256sum -c .github/release-handoffs/pc-v144-handoff.sha256
          python3 .github/release-handoffs/pc144_delta.py reconstruct base.zip handoff.zip FileHub-AIO-PC-1.3.144-win-x64.zip
          sha256sum FileHub-AIO-PC-1.3.144-win-x64.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pc144-verified-package
          path: |
            FileHub-AIO-PC-1.3.144-win-x64.zip
            SHA256SUMS
          compression-level: 0
          retention-days: 2
  native-driver-regression:
    needs: reconstruct
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        driver: ['2.2.26323', '2.1.25156']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pc144-verified-package
          path: package
      - name: Install exact native driver on disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = (Resolve-Path package/FileHub-AIO-PC-1.3.144-win-x64.zip).Path
          $sum = (Get-Content package/SHA256SUMS -Raw).Trim().Split(' ')[0]
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $sum) { throw 'Artifact hash mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath candidate -Force
          $version = '${{ matrix.driver }}'
          if ($version -eq '2.2.26323') {
            $msi = (Resolve-Path candidate/tools/winfsp-2.2.26323.msi).Path
            $expected = '36CE01F9EEDBBE6842B7FB4BEDC79D7D4F71983E8ACEB6877B46A07B331C7E19'
          } else {
            $msi = Join-Path $env:RUNNER_TEMP 'winfsp-2.1.25156.msi'
            Invoke-WebRequest 'https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi' -OutFile $msi
            $expected = '073A70E00F77423E34BED98B86E600DEF93393BA5822204FAC57A29324DB9F7A'
          }
          if ((Get-FileHash $msi -Algorithm SHA256).Hash -ne $expected) { throw 'Driver hash mismatch' }
          $dll = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'WinFsp/bin/winfsp-x64.dll'
          $actual = if(Test-Path $dll){(Get-Item $dll).VersionInfo.FileVersion}else{''}
          if (!$actual.StartsWith($version)) {
            $proc = Start-Process msiexec.exe -ArgumentList @('/i', ('"'+$msi+'"'), '/qn', '/norestart', 'INSTALLLEVEL=1000') -Wait -PassThru
            if ($proc.ExitCode -notin @(0,3010)) { throw ('WinFsp installation failed: '+$proc.ExitCode) }
          }
          $actual = (Get-Item $dll).VersionInfo.FileVersion
          if (!$actual.StartsWith($version)) { throw ('Wrong installed native driver: '+$actual) }
          Write-Output ('WINFSP_EXACT_NATIVE_DRIVER_READY '+$actual)
      - name: Real Google and WebDAV WinFsp regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bridge = (Resolve-Path candidate/tools/NASMountLockBridge.exe).Path
          $result = & $bridge --direct-google-winfsp-policy-test 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw $result }
          foreach($marker in @('GOOGLE_DIRECT_WINFSP_REAL_WINDOWS_READ_PASS','GOOGLE_DIRECT_WINFSP_REAL_WINDOWS_NEW_FILE_UPLOAD_PASS','GOOGLE_DIRECT_WINFSP_EXISTING_BINARY_REPEAT_SAVE_PASS','GOOGLE_DIRECT_TWO_CLIENT_STALE_WRITE_RECOVERY_PASS','GOOGLE_DIRECT_WINFSP_REAL_WINDOWS_FILE_RENAME_TRASH_PASS')) {
            if(!$result.Contains($marker)){throw ('Missing native regression: '+$marker)}
          }
          if ('${{ matrix.driver }}' -eq '2.1.25156' -and !$result.Contains('WINFSP_LEGACY_MANAGED_BINDING_SELECTED')) { throw 'Legacy binding was not selected' }
          if ('${{ matrix.driver }}' -eq '2.2.26323' -and $result.Contains('WINFSP_LEGACY_MANAGED_BINDING_SELECTED')) { throw 'New binding was not selected' }
          Write-Output $result
          $env:FILEHUB_TEST_PUBLISHED_BRIDGE = $bridge
          $env:FILEHUB_LAB_RCLONE = (Resolve-Path candidate/tools/rclone.exe).Path
          & ./tests/direct_webdav_managed_lifecycle_lab.ps1 -Port 23250 -SynologyVirtualRoot
          if(!$?){throw 'WebDAV lifecycle regression'}
          & $bridge --winfsp-binding-compatibility-test
          if($LASTEXITCODE){throw 'Managed compatibility test failed'}
          & $bridge --self-test
          if($LASTEXITCODE){throw 'Bridge self-test failed'}
  publish:
    needs: [reconstruct, native-driver-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pc144-verified-package
      - name: Publish verified Windows-only OTA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          cat .github/release-handoffs/pc-v144.part* > handoff.zip
          sha256sum -c .github/release-handoffs/pc-v144-handoff.sha256
          python3 .github/release-handoffs/pc144_delta.py verify handoff.zip FileHub-AIO-PC-1.3.144-win-x64.zip
          if gh release view pc-v1.3.144 >/dev/null 2>&1; then
            echo 'Refusing to replace an existing release'
            exit 1
          fi
          latest_before="$(gh api repos/$GH_REPO/releases/latest --jq .tag_name)"
          cat > notes.txt <<'NOTES'
          FileHub AIO PC v1.3.144 - stable engine and runtime refresh

          - WinFsp native installer and managed SDK 2.2.26323 (2026 stable); verified 2.1 managed fallback for existing native 2.1 installations. No automatic shared-driver replacement.
          - .NET self-contained runtime 10.0.15 and WebView2 SDK 1.0.4370.26. Official stable rclone and TeraBox engines unchanged.
          - Actual local Excel regression passed: no ETags, large workbook, SaveAs, five repeat saves, original preservation, and second-mount lock conflict. Local tests used the installed WinFsp 2.2 beta driver.
          - Exact native WinFsp 2.2 and 2.1 disposable-runner Google and WebDAV regressions passed before publishing.
          - Existing PC menus, file locking and connection logic retained. Production NAS and cloud-account acceptance remains pending.
          NOTES
          printf '\nArchive SHA256: %s\n' "$(cut -d ' ' -f 1 SHA256SUMS)" >> notes.txt
          gh release create pc-v1.3.144 FileHub-AIO-PC-1.3.144-win-x64.zip SHA256SUMS --target "$GITHUB_SHA" --latest=false --title 'FileHub AIO PC v1.3.144' --notes-file notes.txt
          gh release view pc-v1.3.144 --json tagName,isDraft,isPrerelease,assets > release.json
          python3 - <<'PY'
          import json, pathlib, hashlib
          r=json.load(open('release.json'))
          assert r['tagName']=='pc-v1.3.144' and not r['isDraft'] and not r['isPrerelease']
          f=pathlib.Path('FileHub-AIO-PC-1.3.144-win-x64.zip')
          a=next(a for a in r['assets'] if a['name']==f.name)
          with f.open('rb') as stream: digest=hashlib.file_digest(stream,'sha256').hexdigest()
          assert a['size']==f.stat().st_size and a['digest']=='sha256:'+digest
          print('PC144_OFFICIAL_RELEASE_SUCCESS',digest)
          PY
          test "$(gh api repos/$GH_REPO/releases/latest --jq .tag_name)" = "$latest_before"
