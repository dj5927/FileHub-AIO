name: Publish verified FileHub Android v0.1.118 stable OTA
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[ANDROID_V118_STABLE_20261124]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download and validate the already tested signed APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 'https://github.com/dj5927/FileHub-AIO/releases/download/android-test-v0.1.118/FileHub-AIO-v0.1.118.apk' -o FileHub-AIO-v0.1.118.apk
          test "$(stat -c %s FileHub-AIO-v0.1.118.apk)" = 84064229
          printf '%s\n' 'd4f454974ea6ef83048a75563bd8b9f13ad60aeae433ea823d2f4622f554ba66  FileHub-AIO-v0.1.118.apk' > SHA256SUMS
          sha256sum -c SHA256SUMS
          unzip -tqq FileHub-AIO-v0.1.118.apk
      - name: Promote the verified build to stable Android OTA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/releases/latest --jq .tag_name)" = v0.1.117
          if gh release view v0.1.118 >/dev/null 2>&1; then
            echo 'Refusing to overwrite existing release'
            exit 1
          fi
          cat > notes.txt <<'NOTES'
          versionCode: 119

          FileHub AIO Android v0.1.118
          - Updated rhwp to 0.9.1, NextLib to 1.11.1-0.19.0, Lifecycle to 2.11.1, Bouncy Castle to 1.87, AGP to 9.5.2 and Gradle to 9.9.2.
          - 586 executed unit tests passed, one existing skip. Excel formatting, images, scrolling, pinch zoom, lossless save and HWP/HWPX edit/save/reopen regressions passed.
          - Existing Excel/Word/PPT custom assets, file locking, application ID, Android target SDK and signing certificate retained.
          - Identical APK to the verified manual test build. Real-device acceptance remains pending; promoted to OTA at the owner's request.
          - SHA256: d4f454974ea6ef83048a75563bd8b9f13ad60aeae433ea823d2f4622f554ba66
          NOTES
          gh release create v0.1.118 FileHub-AIO-v0.1.118.apk SHA256SUMS --target "$GITHUB_SHA" --draft --title 'FileHub AIO Android v0.1.118' --notes-file notes.txt
          gh release view v0.1.118 --json tagName,isDraft,isPrerelease,body,assets > release.json
          python3 - <<'PY'
          import json, re
          r=json.load(open('release.json'))
          assert r['tagName']=='v0.1.118' and r['isDraft'] and not r['isPrerelease']
          assert re.search(r'(?m)^versionCode:\s*119\s*$',r['body'])
          a=next(a for a in r['assets'] if a['name']=='FileHub-AIO-v0.1.118.apk')
          assert a['size']==84064229
          assert a['digest'].lower()=='sha256:d4f454974ea6ef83048a75563bd8b9f13ad60aeae433ea823d2f4622f554ba66'
          PY
          gh release edit v0.1.118 --draft=false --latest
          gh api "repos/$GH_REPO/releases/latest" > latest.json
          python3 - <<'PY'
          import json,re
          r=json.load(open('latest.json'))
          assert r['tag_name']=='v0.1.118' and not r['draft'] and not r['prerelease']
          assert re.search(r'(?m)^versionCode:\s*119\s*$',r['body'])
          a=next(a for a in r['assets'] if a['name']=='FileHub-AIO-v0.1.118.apk')
          assert a['browser_download_url']=='https://github.com/dj5927/FileHub-AIO/releases/download/v0.1.118/FileHub-AIO-v0.1.118.apk'
          assert a['size']==84064229 and a['digest']=='sha256:d4f454974ea6ef83048a75563bd8b9f13ad60aeae433ea823d2f4622f554ba66'
          print('ANDROID118_STABLE_OTA_VERIFIED')
          PY
