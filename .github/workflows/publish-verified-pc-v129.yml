name: Publish FileHub PC v1.3.129 verified copy-progress release
on:
  push:
    branches: [pc/windows]
permissions:
  contents: write
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[PC_BINARY_HANDOFF_20261123_V129]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Download and verify 11 individually pinned release parts
        shell: bash
        run: |
          set -euo pipefail
          for i in {00..10}; do
            curl --http1.1 --fail --location --retry 6 --retry-all-errors --retry-delay 3 --connect-timeout 15 --max-time 320 "https://students-lesson-tuner-lone.trycloudflare.com/pc-v129-part${i}" -o "pc-v129-part${i}"
            test -s "pc-v129-part${i}"
            echo "PC129_PART_${i}_READY"
          done
          cat pc-v129-part{00..10} > FileHub-AIO-PC-1.3.129-win-x64.zip
          test "$(stat -c '%s' FileHub-AIO-PC-1.3.129-win-x64.zip)" -eq 168913736
          echo 'D589FDBD0B9E3D5F59F3EBC7631F489EE4BEA593D0CCEF29205E6F01AE47BF73  FileHub-AIO-PC-1.3.129-win-x64.zip' | sha256sum -c -
          unzip -tqq FileHub-AIO-PC-1.3.129-win-x64.zip
          unzip -Z1 FileHub-AIO-PC-1.3.129-win-x64.zip | grep -Fx FileHubAIO.exe
          unzip -Z1 FileHub-AIO-PC-1.3.129-win-x64.zip | grep -Fx tools/NASMountLockBridge.exe
          unzip -Z1 FileHub-AIO-PC-1.3.129-win-x64.zip | grep -Fx tools/rclone.exe
          unzip -Z1 FileHub-AIO-PC-1.3.129-win-x64.zip | grep -Fx tools/google-oauth-desktop.json
          printf '%s\n' 'D589FDBD0B9E3D5F59F3EBC7631F489EE4BEA593D0CCEF29205E6F01AE47BF73  FileHub-AIO-PC-1.3.129-win-x64.zip' > SHA256SUMS
          echo 'PC129_FULL_ARCHIVE_VERIFIED'
      - name: Publish official Windows-only OTA release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view pc-v1.3.129 >/dev/null 2>&1; then
            echo 'Version exists; refusing to replace official release'
            exit 1
          fi
          gh release create pc-v1.3.129 FileHub-AIO-PC-1.3.129-win-x64.zip SHA256SUMS --target "$GITHUB_SHA" --latest=false --title 'FileHub AIO PC v1.3.129' --notes 'Windows PC: WebDAV single-WinFsp file-copy progress. New sequential files with known sizes use a guarded progressive WebDAV staging upload; WinFsp writes wait for network progress so Explorer no longer first appears at 99% on supported servers. Safe fallback retains conditional PUT and recovery journaling on incompatible servers and existing-file edits. Local 24MiB/23.6MB checksum tests, throttled CopyFileEx progress, WebDAV Office/lock/crash-recovery tests passed. Existing publisher Google OAuth and other storage providers retained. Android release unaffected. SHA256: D589FDBD0B9E3D5F59F3EBC7631F489EE4BEA593D0CCEF29205E6F01AE47BF73. NAS-specific performance requires on-device verification.'
          gh release view pc-v1.3.129 --json tagName,url,assets
          echo 'PC129_OFFICIAL_GITHUB_RELEASE_SUCCESS'
