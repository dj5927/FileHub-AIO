name: Publish verified FileHub PC v1.3.134 native-lock option removal
on:
  push:
    branches: [pc/windows]
permissions:
  contents: write
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[PC_BINARY_HANDOFF_20261123_V134]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Reassemble and verify immutable Windows ZIP parts
        shell: bash
        run: |
          set -euo pipefail
          for i in {00..10}; do
            curl --http1.1 --fail --location --retry 6 --retry-all-errors --retry-delay 3 --connect-timeout 15 --max-time 320 "https://functional-abs-focused-markers.trycloudflare.com/pc-v134-part${i}" -o "pc-v134-part${i}"
            test -s "pc-v134-part${i}"
            echo "PC134_PART_${i}_READY"
          done
          cat pc-v134-part{00..10} > FileHub-AIO-PC-1.3.134-win-x64.zip
          test "$(stat -c '%s' FileHub-AIO-PC-1.3.134-win-x64.zip)" -eq 168933682
          echo 'A8FC94E5D73EEA4CFC99BC36CA0B9CBDBD85ACFB1CB7E0080B697BF3D6D69DB8  FileHub-AIO-PC-1.3.134-win-x64.zip' | sha256sum -c -
          unzip -tqq FileHub-AIO-PC-1.3.134-win-x64.zip
          unzip -Z1 FileHub-AIO-PC-1.3.134-win-x64.zip | grep -Fx FileHubAIO.exe
          unzip -Z1 FileHub-AIO-PC-1.3.134-win-x64.zip | grep -Fx tools/NASMountLockBridge.exe
          unzip -Z1 FileHub-AIO-PC-1.3.134-win-x64.zip | grep -Fx tools/rclone.exe
          unzip -Z1 FileHub-AIO-PC-1.3.134-win-x64.zip | grep -Fx tools/google-oauth-desktop.json
          unzip -Z1 FileHub-AIO-PC-1.3.134-win-x64.zip | grep -Fx README_PC_V134_KR.txt
          printf '%s\n' 'A8FC94E5D73EEA4CFC99BC36CA0B9CBDBD85ACFB1CB7E0080B697BF3D6D69DB8  FileHub-AIO-PC-1.3.134-win-x64.zip' > SHA256SUMS
          echo 'PC134_OFFICIAL_ARCHIVE_VERIFIED'
      - name: Publish official PC-only v1.3.134 OTA release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view pc-v1.3.134 >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite'
            exit 1
          fi
          gh release create pc-v1.3.134 FileHub-AIO-PC-1.3.134-win-x64.zip SHA256SUMS --target "$GITHUB_SHA" --latest=false --title 'FileHub AIO PC v1.3.134' --notes 'Remove redundant experimental WebDAV native server LOCK checkbox, its warning dialogs, the global WebDAV LOCK capability test button and the obsolete status label. Old saved/portable profiles with UseNativeWebDavLocks=true now safely migrate to the direct WinFsp WebDAV engine without changing credentials or connection names. Keep v1.3.133 RaiDrive-compatible real Excel ~$ owner file locking and WebDAV conditional ETag safety. PC app route policy, legacy config and backup round trip, updater, version UI, Google publisher OAuth, login UI and LockBridge self-test passed. Android is NOT changed in this PC-only release. Official ZIP SHA256 A8FC94E5D73EEA4CFC99BC36CA0B9CBDBD85ACFB1CB7E0080B697BF3D6D69DB8.'
          gh release view pc-v1.3.134 --json tagName,url,assets
          echo 'PC134_OFFICIAL_RELEASE_SUCCESS'
