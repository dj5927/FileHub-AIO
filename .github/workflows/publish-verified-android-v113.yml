name: Publish verified FileHub Android v0.1.113
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[ANDROID_BINARY_HANDOFF_20261123_V113]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Verify signed Android v0.1.113 file
        shell: bash
        run: |
          set -euo pipefail
          curl --http1.1 --fail --location --retry 6 --retry-all-errors --retry-delay 3 --connect-timeout 15 --max-time 850 'https://pushed-belly-andrew-airport.trycloudflare.com/FileHub-AIO-v0.1.113.apk' -o FileHub-AIO-v0.1.113.apk
          test "$(stat -c '%s' FileHub-AIO-v0.1.113.apk)" -eq 72631745
          echo 'DD484663C67AD09ED83E11B4237200580CF92094E68853621FEF699D8A6ADE60  FileHub-AIO-v0.1.113.apk' | sha256sum -c -
          unzip -Z1 FileHub-AIO-v0.1.113.apk | grep -Fx AndroidManifest.xml
          echo 'ANDROID_V113_VERIFIED'
      - name: Publish FileHub AIO Android OTA v0.1.113
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.1.113 >/dev/null 2>&1; then
            echo 'Release already exists, refusing overwrite'
            exit 1
          fi
          gh release create v0.1.113 FileHub-AIO-v0.1.113.apk --target "$GITHUB_SHA" --latest --title 'FileHub AIO Android v0.1.113' --notes 'versionCode: 114

          - Steam Deck SFTP browsing performance fix: stop spawning a separate SSH connection for every visible subfolder just to display child counts.
          - SFTP folder subtitle now shows folder rather than indefinitely displaying a loading count. File size, modified time and symlink navigation remain enabled.
          - Preserves SSH login-home selection and Linux chmod feature.
          - No changes to Windows PC release or other remote storage providers.
          - SHA256: DD484663C67AD09ED83E11B4237200580CF92094E68853621FEF699D8A6ADE60
          - Real Steam Deck speed validation still requires an Android device.'
          gh release view v0.1.113 --json url,tagName,assets
