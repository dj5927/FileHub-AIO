name: Publish Android v0.1.155 source only
on:
  push:
    branches: [maintenance/android-ota-retire-public]
    paths: ['.github/workflows/publish-android-v155-source-only.yml']
permissions:
  contents: write
jobs:
  source:
    if: github.repository == 'dj5927/FileHub-AIO'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android/flutter-migration
          fetch-depth: 1
      - name: Verify exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FileHub source publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false
          test "$(git rev-parse HEAD)" = '8768dd2eb4e1193119c2968b5f5cdccc3f7f9b75'
          archive="$RUNNER_TEMP/filehub-source.zip"
          staging="$RUNNER_TEMP/filehub-source"
          curl --fail --location --retry 3 --connect-timeout 15 --user-agent 'FileHub-AIO-Android-OTA' 'https://bangtanrun.com/filehub/FileHub-AIO-Direct-v0.1.155-source.zip' --output "$archive"
          echo '2e080280272de4308c739164bd2faac39eba641089e112158363472908da842e  '"$archive" | sha256sum -c -
          mkdir "$staging"
          unzip -q "$archive" -d "$staging"
          test -z "$(find "$staging" -type f \( -iname '*.apk' -o -iname '*.aab' -o -iname '*.jks' -o -iname '*.p12' -o -iname '*.keystore' -o -name 'access.key' \) -print)"
          test ! -d "$staging/.github/release-handoffs"
          test ! -d "$staging/release-assets"
          rsync -a --delete --exclude='/.git/' "$staging/" ./
          git add -A
          git diff --cached --exit-code -- .github/workflows
          tree="$(git write-tree)"
          test "$tree" = '1d2eda1378f97ddfa7bc46d4be711e36d5ac03eb'
          git commit -m 'Add local recycle bin and unified remote protocol icons; Direct 0.1.155 / Play 1.0.38'
          git push origin HEAD:refs/heads/android/flutter-migration
          echo "Source tree $tree published; no APK, AAB or tags created."
