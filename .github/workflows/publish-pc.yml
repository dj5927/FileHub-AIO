name: Publish Windows PC release

on:
  push:
    branches:
      - pc/windows

permissions:
  contents: write

concurrency:
  group: filehub-pc-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out Windows PC sources
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Derive PC-only release tag
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content NASMount.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected Windows version $version" }
          $tag = "pc-v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "asset=FileHub-AIO-PC-$version-win-x64.zip" >> $env:GITHUB_OUTPUT

      - name: Reject an already published Windows version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Version $tag already published; increase PC version" }
          exit 0

      - name: Offline updater and Synology sharing policy tests
        shell: pwsh
        run: |
          dotnet restore NASMount.csproj
          dotnet run --project NASMount.csproj -c Release -- --pc-updater-policy-test
          if ($LASTEXITCODE -ne 0) { throw 'PC update policy test failed' }
          dotnet run --project NASMount.csproj -c Release -- --synology-share-policy-test
          if ($LASTEXITCODE -ne 0) { throw 'Synology multi-share/path policy test failed' }
          dotnet run --project NASMount.csproj -c Release -- --winfsp-execute-policy-test
          if ($LASTEXITCODE -ne 0) { throw 'WinFsp mounted EXE execution permission regression' }
          dotnet run --project NASMount.csproj -c Release -- --direct-webdav-routing-policy-test
          if ($LASTEXITCODE -ne 0) { throw 'Single-WinFsp WebDAV routing regression' }

      - name: Build Windows app and lock bridge
        shell: pwsh
        run: |
          dotnet publish NASMount.csproj -c Release -r win-x64 --self-contained true -o publish
          if ($LASTEXITCODE -ne 0) { throw 'App publish failed' }
          dotnet publish LockBridge/LockBridge.csproj -c Release -r win-x64 --self-contained true -o bridge
          if ($LASTEXITCODE -ne 0) { throw 'Bridge publish failed' }
          New-Item -ItemType Directory -Force -Path publish/tools | Out-Null
          Copy-Item bridge/* publish/tools -Recurse -Force

      - name: Verify LockBridge local-save provenance policy
        shell: pwsh
        run: |
          $output = & ./bridge/NASMountLockBridge.exe --self-test 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or
              $output -notmatch 'WEBDAV_DDNS_ALIAS_TLS_POLICY_PASS' -or
              $output -notmatch 'LOCKBRIDGE_LOCK_CONFLICT_VS_TLS_ERROR_POLICY_PASS' -or
              $output -notmatch 'LOCAL_EXCEL_REPEAT_SAVE_ECHO_POLICY_PASS' -or
              $output -notmatch 'LOCAL_EXCEL_SAVE_NOTIFICATION_PROVENANCE_PASS') {
            throw 'LockBridge DDNS TLS / Excel multiple-save provenance regression: ' + $output
          }

      - name: Verify direct Google REST and dedicated OAuth groundwork without rclone
        shell: pwsh
        run: |
          # Uses an in-memory loopback mock: no live Google account/API,
          # rclone process, local Drive mounts or credential mutations.
          $output = & ./publish/FileHubAIO.exe --google-direct-api-policy-test 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or
              $output -notmatch 'GOOGLE_DIRECT_API_HTTPCLIENT_AND_FOLDER_CACHE_PASS' -or
              $output -notmatch 'GOOGLE_DIRECT_API_FOLDER_CREATE_RENAME_INVALIDATE_PASS' -or
              $output -notmatch 'GOOGLE_DIRECT_CUSTOM_OAUTH_SINGLE_REFRESH_NO_RCLONE_PASS') {
            throw 'Direct Google API/OAuth regression: ' + $output
          }

      - name: Fetch SHA-256 pinned upstream engines
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path vendor | Out-Null
          function FetchVerified($url, $filename, $digest) {
            $path = Join-Path vendor $filename
            Invoke-WebRequest -Uri $url -OutFile $path -MaximumRedirection 6
            if ((Get-FileHash $path -Algorithm SHA256).Hash -ne $digest) {
              throw "Checksum mismatch for $filename"
            }
            return $path
          }
          $regular = FetchVerified 'https://github.com/rclone/rclone/releases/download/v1.76.0/rclone-v1.76.0-windows-amd64.zip' 'rclone.zip' '8B4FD2737ADE4E70C057EF4A49DEB7CFFE94B0FB9D7587C189D149823F21A1DC'
          $extra = FetchVerified 'https://github.com/gulp79/rclone-extra/releases/download/v1.76.0-extra/rclone-windows-amd64.zip' 'rclone-extra.zip' 'A9BB4C6F30E7C6F73ABA05D9EA3355C0C540E7ADD2E10480A7C976516DCD2D37'
          $msi = FetchVerified 'https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi' 'winfsp-2.1.25156.msi' '073A70E00F77423E34BED98B86E600DEF93393BA5822204FAC57A29324DB9F7A'
          Expand-Archive $regular -DestinationPath vendor/rclone -Force
          Expand-Archive $extra -DestinationPath vendor/rclone-extra -Force
          $normalExe = Get-ChildItem vendor/rclone -Filter rclone.exe -Recurse -File | Select-Object -First 1 -ExpandProperty FullName
          $extraExe = Get-ChildItem vendor/rclone-extra -Filter rclone.exe -Recurse -File | Select-Object -First 1 -ExpandProperty FullName
          if (-not $normalExe -or -not $extraExe) { throw 'Missing backend binary' }
          if ((Get-FileHash $normalExe -Algorithm SHA256).Hash -ne 'ACD80683E23151E93BBE0D6FFA74D26E542EC510332F630BEECB9944F8D1A623') { throw 'Regular rclone changed' }
          if ((Get-FileHash $extraExe -Algorithm SHA256).Hash -ne 'A72B8D123517696C4CC996FD17BD7509DDD7850B5E13893EE970F8C8A2B8390C') { throw 'TeraBox engine changed' }
          Copy-Item $normalExe publish/tools/rclone.exe -Force
          Copy-Item $extraExe publish/tools/rclone-terabox.exe -Force
          Copy-Item $msi publish/tools/winfsp-2.1.25156.msi -Force
          (Get-FileHash publish/tools/rclone.exe -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content publish/tools/rclone.sha256 -Encoding ascii
          (Get-FileHash publish/tools/rclone-terabox.exe -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content publish/tools/rclone-terabox.sha256 -Encoding ascii

      - name: Guarded WebDAV save, conflict and crash-recovery integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:FILEHUB_LAB_RCLONE = (Resolve-Path publish/tools/rclone.exe).Path
          $env:FILEHUB_TEST_PUBLISHED_BRIDGE = (Resolve-Path bridge/NASMountLockBridge.exe).Path
          & ./tests/direct_webdav_write_store_lab.ps1 -Port 18784
          if (-not $?) { throw 'Guarded WebDAV crash recovery and cross-PC lease regression' }

      - name: Install WinFsp for Windows drive-mount integration tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $driverDll = Join-Path ${env:ProgramFiles(x86)} 'WinFsp\bin\winfsp-x64.dll'
          if (!(Test-Path $driverDll)) {
            $installer = (Resolve-Path publish/tools/winfsp-2.1.25156.msi).Path
            $arguments = '/i "' + $installer + '" /qn /norestart'
            $proc = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
            if ($proc.ExitCode -notin @(0, 3010)) {
              throw ('WinFsp integration driver installation failed code=' + $proc.ExitCode)
            }
          }
          if (!(Test-Path $driverDll)) { throw 'WinFsp driver missing after installation' }
          Write-Output 'WINFSP_ACTUAL_WINDOWS_MOUNT_TEST_DRIVER_READY'

      - name: Windows Explorer nonzero space, WebDAV upload and replacement integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:FILEHUB_LAB_RCLONE = (Resolve-Path publish/tools/rclone.exe).Path
          $env:FILEHUB_TEST_PUBLISHED_BRIDGE = (Resolve-Path bridge/NASMountLockBridge.exe).Path
          # Office is not installed on GitHub hosted Windows runners; the
          # actual Excel COM tests run separately in the local Windows lab.
          & ./tests/direct_webdav_writable_winfsp_lab.ps1 -Port 18795 -SkipExcel
          if (-not $?) { throw 'Writable WinFsp Explorer quota/copy/replace regression' }

      - name: Synology virtual-root WebDAV and automatic legacy compatibility fallback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:FILEHUB_LAB_RCLONE = (Resolve-Path publish/tools/rclone.exe).Path
          $env:FILEHUB_TEST_PUBLISHED_BRIDGE = (Resolve-Path bridge/NASMountLockBridge.exe).Path
          $env:FILEHUB_TEST_PUBLISHED_APP = (Resolve-Path publish/FileHubAIO.exe).Path
          & ./tests/direct_webdav_managed_lifecycle_lab.ps1 -Port 18786 -SynologyVirtualRoot
          if (-not $?) { throw 'Synology writable-share WebDAV direct engine regression' }
          & ./tests/direct_webdav_compatibility_gui_lab.ps1 -Port 18788
          if (-not $?) { throw 'WebDAV GUI compatibility fallback regression' }

      - name: Check out pinned rclone sources for Google-only engine
        uses: actions/checkout@v7
        with:
          repository: rclone/rclone
          ref: v1.76.0
          path: vendor/rclone-source
          persist-credentials: false

      - name: Install pinned Go toolchain for Google-only engine
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.11'
          cache: true
          cache-dependency-path: vendor/rclone-source/go.sum

      - name: Build patched Google async quota engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $patch = Join-Path $root 'third_party/rclone-1.76.0-filehub-async-quota.patch'
          Push-Location vendor/rclone-source
          try {
            git -c core.autocrlf=false apply --check $patch
            if ($LASTEXITCODE -ne 0) { throw 'Google quota patch does not apply to rclone v1.76.0' }
            git -c core.autocrlf=false apply $patch
            if ($LASTEXITCODE -ne 0) { throw 'Google quota patch application failed' }
            $env:CGO_ENABLED = '0'
            go build -tags cmount -trimpath -ldflags '-s -w' -buildvcs=false -o (Join-Path $root 'publish/tools/rclone-filehub-google.exe') .
            if ($LASTEXITCODE -ne 0) { throw 'Google quota rclone build failed' }
          }
          finally { Pop-Location }
          $googleExe = 'publish/tools/rclone-filehub-google.exe'
          # The official tagged sources and exact patch are fixed above.
          # Go linker builds on different runner images can legitimately
          # differ byte-for-byte; hash the actual release binary instead of
          # comparing with a hash generated on a developer workstation.
          $googleHash = (Get-FileHash $googleExe -Algorithm SHA256).Hash
          if ($googleHash -in @(
              'ACD80683E23151E93BBE0D6FFA74D26E542EC510332F630BEECB9944F8D1A623',
              'A72B8D123517696C4CC996FD17BD7509DDD7850B5E13893EE970F8C8A2B8390C')) {
            throw 'The Google patched engine was replaced by an upstream backend'
          }
          $marker = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes(
            (Resolve-Path $googleExe).Path))
          if (-not $marker.Contains('FILEHUB_QUOTA_CACHED')) {
            throw 'Google async quota VFS patch marker missing from built engine'
          }
          $googleHash.ToLowerInvariant() |
            Set-Content publish/tools/rclone-filehub-google.sha256 -Encoding ascii
          Write-Output ('RELEASE_GOOGLE_ENGINE_SHA256=' + $googleHash)
          & $googleExe mount --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Google quota engine lacks Windows mount command' }

      - name: Regression-check bundled Google engine integrity before release
        shell: pwsh
        run: |
          $output = & ./publish/FileHubAIO.exe --google-cold-start-policy-test 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or
              $output -notmatch 'GOOGLE_DESKTOP_OAUTH_JSON_IMPORT_POLICY_PASS' -or
              $output -notmatch 'GOOGLE_OAUTH_ABOUT_ONLY_VALIDATION_POLICY_PASS' -or
              $output -notmatch 'RCLONE_THREE_ENGINE_DISTINCT_MANIFEST_POLICY_PASS' -or
              $output -notmatch 'GOOGLE_ASYNC_QUOTA_BUNDLED_BINARY_SHA256_PASS') {
            throw 'Packaged Google engine integrity preflight failed: ' + $output
          }

      - name: Verify WinFsp WebDAV LockBridge labels and existing cloud names
        shell: pwsh
        run: |
          $output = & ./publish/FileHubAIO.exe --explorer-label-policy-test 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or
              $output -notmatch 'SHORT_KOREAN_WEBDAV_NETWORK_LABEL_POLICY_PASS' -or
              $output -notmatch 'WEBDAV_LOCKBRIDGE_OWNED_UNC_LABEL_POLICY_PASS' -or
              $output -notmatch 'EXPLORER_CLOUD_LABEL_MYBOX_ONEDRIVE_POLICY_PASS') {
            throw 'WinFsp network-label regression: ' + $output
          }

      - name: Build Windows full ZIP
        shell: pwsh
        run: |
          $asset = '${{ steps.version.outputs.asset }}'
          foreach ($required in @('FileHubAIO.exe','tools/NASMountLockBridge.exe','tools/rclone.exe','tools/rclone.sha256','tools/rclone-filehub-google.exe','tools/rclone-filehub-google.sha256','tools/rclone-terabox.exe','tools/rclone-terabox.sha256','tools/winfsp-2.1.25156.msi')) {
            if (-not (Test-Path ("publish/" + $required))) { throw "Missing $required" }
          }
          Copy-Item README.md publish/README.md -Force
          Copy-Item GOOGLE_OAUTH_SETUP_KR.md publish/GOOGLE_OAUTH_SETUP_KR.md -Force
          Copy-Item third_party publish/third_party -Recurse -Force
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Compress-Archive -Path publish/* -DestinationPath ("release-assets/" + $asset) -CompressionLevel Optimal
          $hash = (Get-FileHash ("release-assets/" + $asset) -Algorithm SHA256).Hash
          "$hash  $asset" | Set-Content release-assets/SHA256SUMS -Encoding ascii
          @"
          ## FileHub AIO PC ${{ steps.version.outputs.tag }}
          - Windows PC 전용 릴리즈. Android APK 및 Android 최신 릴리즈는 변경하지 않습니다.
          - WebDAV 입력 주소가 어떤 업체 DDNS여도 NAS 제조사 추정 없이 사용하며, 유효한 HTTPS 인증서의 별칭 이름 불일치만 WebDAV 잠금 브리지에서 허용합니다.
          - Excel 파일 점유 충돌과 HTTPS 인증서·네트워크 오류를 별도로 처리하며, 실제 잠금 소유권을 확인하지 않고 파일을 삭제하지 않습니다.
          - Google Drive 전용 OAuth Client ID 전환 지원: 데스크톱 OAuth JSON 가져오기, 공용/전용 인증 모드 표시, 공용 인증 명시 동의.
          - 새 Google 인증 검증 시 불필요한 폴더 목록 조회를 없애고 rclone about --json으로 접근 여부만 확인. 이전 인증 백업과 복원 유지.
          - 공용 Client ID의 403 API 제한으로 인한 30~35초 연결 지연은 전용 OAuth 재인증 후 실제 재측정이 필요합니다.
          - WebDAV LockBridge 네트워크 위치에서 사용자 설정 드라이브명 유지 (\\NASMount-... 노출 수정).
          - Google Drive 실제 전체/사용/남은 용량을 비동기 캐시로 표시하며 탐색기 응답 지연 방지.
          - Google 전용 rclone, 일반 rclone, TeraBox 엔진의 SHA-256을 각각 독립 검증.
          - 트레이 프로그램 종료·수동 연결 해제는 사용자 경고 동의 후 FileHub 소유 연결을 강제 해제합니다. 열린 문서와 미완료 업로드가 유실될 수 있으며 복구 캐시/기록은 삭제하지 않습니다.
          - 메인 화면 하단의 상시 업로드/잠금/복구 기록 안내 및 5초 주기 상태 조회를 제거했습니다. 필요하면 수동 [업로드 상태 확인]에서 상세 진단할 수 있습니다.
          - 로컬 복구 기록은 임의 삭제하지 않으며, 실제 파일 저장 무결성 오류만 별도로 1회 알립니다.
          - PC 업데이트 설치 확인에서 사용자가 강제 해제를 승인하면, Excel 잠금·열린 EXE·복구 기록이 있어도 FileHub 소유 프로세스를 강제 해제한 후 설치합니다. 미저장/미전송 데이터 손실 가능성을 표시하고 캐시는 삭제하지 않습니다.
          - WebDAV 엑셀 저장 중 임시파일을 기존 파일명으로 교체할 때 대상 ETag 조건부 PUT, 최종 체크섬 검증, 원본 임시파일 조건부 삭제를 적용합니다. Windows 파일 수정시간·속성 처리도 개선했습니다.
          - WebDAV 폴더 감시 주기를 15초로 변경하고 저장 중 외부수정 오탐을 줄였습니다. 이미지 읽기 전용 캐시로 반복 HTTP 요청을 줄였습니다.
          - 실제 WinFsp 테스트에서 기존 파일 교체 3회/임시파일 미잔류, 한글 경로 기존 XLSX 5회 저장, 이미지 읽기, 쓰기잠금 충돌 차단을 통과했습니다. 실제 Synology 사용 환경에서 별도 검증이 필요합니다.
          - WebDAV 직접 엔진의 사용 가능 공간 0바이트 버그를 수정했습니다. 저장용 로컬 디스크의 실제 사용 가능 용량을 WinFsp에 보고하며, 이 값은 원격 NAS의 실제 할당량이 아닙니다.
          - WebDAV 저장 성공 후 응답 또는 메타데이터 검증이 지연될 경우, 기존 ETag로 반복 업로드하기 전에 NAS 원본 전체 체크섬을 확인합니다. 다른 사용자의 수정은 덮어쓰지 않습니다.
          - 신규 GitHub Windows CI는 Explorer에서 실제 마운트 드라이브 용량이 0바이트면 실패하도록 검사합니다. 기존 문서와 미완료 저장 복구 기록은 삭제하지 않습니다.
          - Windows 폴더 이름 변경 시 DELETE 접근으로 열린 폴더를 일반 쓰기 파일로 오인해 권한 오류를 내던 WinFsp 핸들 분류를 수정했습니다. 폴더 MOVE는 별도 처리하며 기존 폴더를 덮어쓰지 않습니다.
          - 실제 WinFsp 테스트에서 하위 파일이 있는 폴더의 이름 변경 및 한글 이름 변경까지 검증합니다. Windows/NAS 계정 권한은 변경하지 않습니다.
          - FileHub 내부 Office 잠금 폴더는 실제 NAS에 일시적으로 유지하되 FileHub 탐색기의 목록·직접 조회·변경 알림에서는 보이지 않도록 수정했습니다.
          - Google Drive 네트워크 공유명이 한 글자로 잘려 등록되는 실제 Windows 사례를 확인했습니다. 정확히 FileHub가 소유한 GUID·세션의 MountPoints2 키만 이름을 보정하고, 연결 중 재등록되면 자동 복구하도록 개선했습니다.
          - 별도 rclone 호출 없이 Google Drive v3 API로 폴더 조회·생성·이름 변경 및 전용 Desktop OAuth 토큰 갱신을 수행하는 직접 API 기반 코드를 추가했습니다. 모의 서버 기반 CI 정책 테스트를 수행합니다.
          - 중요: 이번 버전의 일반 Google 드라이브 마운트는 여전히 기존 rclone 엔진입니다. 직접 API 코드는 아직 실험적 기반이며, 직접 WinFsp 읽기·쓰기 및 데이터 안전성 검증 전에는 자동 전환하지 않습니다.
          - 기존 rclone 공용 OAuth로 Google Drive API를 직접 호출해도 403 rateLimitExceeded가 발생한 것을 확인했습니다. 전용 OAuth 인증은 직접 엔진 전환에 필요한 별도 단계입니다.
          - v1.3.120~v1.3.121은 구버전 업데이트 종료 오류로 OTA가 차단될 수 있으므로 이번 버전은 처음 한 번 공식 ZIP 수동 교체가 필요할 수 있습니다.
          - 압축에 전체 Windows 실행 파일과 의존성을 포함하며, 기존 NAS 계정 및 설정 파일은 별도 유지됩니다.
          - 네트워크 환경별 실제 WebDAV 파일 잠금 및 다중 PC Office 동시 편집은 사용 환경에서 별도 검증이 필요합니다.
          "@ | Set-Content release-assets/RELEASE_NOTES.md -Encoding utf8

      - name: Publish PC-only release without changing Android latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $asset = '${{ steps.version.outputs.asset }}'
          gh release create $tag ("release-assets/" + $asset) 'release-assets/SHA256SUMS' --target '${{ github.sha }}' --title "FileHub AIO PC $tag" --notes-file release-assets/RELEASE_NOTES.md --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'PC release publication failed' }
          gh release view $tag --json url,tagName,assets
