name: Validate Android WebDAV Excel ownership v0.1.114
on:
  push:
    branches: [android/office-owner-114]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 37 platform with current Android CLI
        shell: bash
        run: |
          set -euo pipefail
          android sdk list --all "platforms/*" | tail -45
          android sdk install platforms/android-37.0 build-tools/36.0.0
          test -s "$ANDROID_HOME/platforms/android-37.0/android.jar"
          # API 37 platforms may install under android-37.0 while AGP asks
          # for android-37. Keep the symlink only on this disposable runner.
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Validate Office editor JavaScript
        run: node --check app/src/main/assets/office_hwp/office-host.js
      - name: Unit tests and installable debug APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filehub-android-v0.1.114-debug-and-tests
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

