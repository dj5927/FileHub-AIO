name: Publish Android v0.1.156 source only
on:
  push:
    branches: [maintenance/android-ota-retire-public]
    paths: ['.github/workflows/publish-android-v156-source-only.yml']
permissions:
  contents: write
jobs:
  source:
    if: github.repository == 'dj5927/FileHub-AIO'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android/flutter-migration
          fetch-depth: 1
      - name: Verify exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FileHub source publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false
          test "$(git rev-parse HEAD)" = '045b399098f6f79e3c4767be7915af8f85253a33'
          archive="$RUNNER_TEMP/filehub-source.zip"
          staging="$RUNNER_TEMP/filehub-source"
          curl --fail --location --retry 3 --connect-timeout 15 --user-agent 'FileHub-AIO-Android-OTA' 'https://bangtanrun.com/filehub/FileHub-AIO-Direct-v0.1.156-source.zip' --output "$archive"
          echo '8a0d02daef14ba9e5295dfc46a11cca7725c22f27ac45c20aa1cf0486424cb1f  '"$archive" | sha256sum -c -
          mkdir "$staging"
          unzip -q "$archive" -d "$staging"
          test -z "$(find "$staging" -type f \( -iname '*.apk' -o -iname '*.aab' -o -iname '*.jks' -o -iname '*.p12' -o -iname '*.keystore' -o -name 'access.key' \) -print)"
          test ! -d "$staging/.github/release-handoffs"
          test ! -d "$staging/release-assets"
          rsync -a --delete --exclude='/.git/' "$staging/" ./
          git add -A
          git diff --cached --exit-code -- .github/workflows
          tree="$(git write-tree)"
          test "$tree" = '0d87a2ade11bf3ab2814a5cbba059662eb599e20'
          git commit -m 'Fix multilingual IME text input; Direct 0.1.156 / Play 1.0.39'
          git push origin HEAD:refs/heads/android/flutter-migration
          echo "Source tree $tree published; no APK, AAB or tags created."
