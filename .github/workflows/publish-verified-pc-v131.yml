name: Publish FileHub PC v1.3.131 verified Google copy progress
on:
  push:
    branches: [pc/windows]
permissions:
  contents: write
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[PC_BINARY_HANDOFF_20261123_V131]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download pinned parts and verify Windows distribution
        shell: bash
        run: |
          set -euo pipefail
          for i in {00..10}; do
            curl --http1.1 --fail --location --retry 6 --retry-all-errors --retry-delay 3 --connect-timeout 15 --max-time 320 "https://embedded-food-avoiding-perfectly.trycloudflare.com/pc-v131-part${i}" -o "pc-v131-part${i}"
            test -s "pc-v131-part${i}"
            echo "PC131_PART_${i}_READY"
          done
          cat pc-v131-part{00..10} > FileHub-AIO-PC-1.3.131-win-x64.zip
          test "$(stat -c '%s' FileHub-AIO-PC-1.3.131-win-x64.zip)" -eq 168927907
          echo 'A4853F0A24C4084C346639BC1F3559C2CDBED7B490886F8B5929AC36983C8382  FileHub-AIO-PC-1.3.131-win-x64.zip' | sha256sum -c -
          unzip -tqq FileHub-AIO-PC-1.3.131-win-x64.zip
          unzip -Z1 FileHub-AIO-PC-1.3.131-win-x64.zip | grep -Fx FileHubAIO.exe
          unzip -Z1 FileHub-AIO-PC-1.3.131-win-x64.zip | grep -Fx tools/NASMountLockBridge.exe
          unzip -Z1 FileHub-AIO-PC-1.3.131-win-x64.zip | grep -Fx tools/rclone.exe
          unzip -Z1 FileHub-AIO-PC-1.3.131-win-x64.zip | grep -Fx tools/google-oauth-desktop.json
          unzip -Z1 FileHub-AIO-PC-1.3.131-win-x64.zip | grep -Fx README_PC_V131_KR.txt
          printf '%s\n' 'A4853F0A24C4084C346639BC1F3559C2CDBED7B490886F8B5929AC36983C8382  FileHub-AIO-PC-1.3.131-win-x64.zip' > SHA256SUMS
          echo 'PC131_ZIP_VERIFIED'
      - name: Publish official Windows-only release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view pc-v1.3.131 >/dev/null 2>&1; then
            echo 'Release tag already exists, refusing overwrite'
            exit 1
          fi
          gh release create pc-v1.3.131 FileHub-AIO-PC-1.3.131-win-x64.zip SHA256SUMS --target "$GITHUB_SHA" --latest=false --title 'FileHub AIO PC v1.3.131' --notes 'Windows PC Google Drive: stream new sequential file copies through Google Drive resumable API 1/4/8 MiB chunks as WinFsp Write advances, acknowledging only server-confirmed bytes. Windows allocationSize is rounded up, so the true last chunk length is set only at final Cleanup. No premature Google file publication; retain durable local recovery and existing Office/overwrite safety. Mock Google WinFsp CopyFileEx 8MiB+123B: native 0-to-100% progression, 10 samples over ~0.75 seconds, exact byte comparison passed. Google repeat-save/conflict/403 recovery, WebDAV EXE/Excel/24MiB/odd-size regression, Chrome OAuth and updater policy tests passed. MYBOX/TeraBox and Android unchanged. WebDAV final 99% server PUT/MOVE acknowledgment delay may remain and requires NAS-specific timing review. ZIP SHA256 A4853F0A24C4084C346639BC1F3559C2CDBED7B490886F8B5929AC36983C8382.'
          gh release view pc-v1.3.131 --json tagName,url,assets
          echo 'PC131_OFFICIAL_RELEASE_SUCCESS'
