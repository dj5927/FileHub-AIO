name: Publish FileHub PC v1.3.130 verified WebDAV finalize release
on:
  push:
    branches: [pc/windows]
permissions:
  contents: write
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[PC_BINARY_HANDOFF_20261123_V130]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download and checksum-verify eleven PC package parts
        shell: bash
        run: |
          set -euo pipefail
          for i in {00..10}; do
            curl --http1.1 --fail --location --retry 6 --retry-all-errors --retry-delay 3 --connect-timeout 15 --max-time 320 "https://random-lat-quebec-res.trycloudflare.com/pc-v130-part${i}" -o "pc-v130-part${i}"
            test -s "pc-v130-part${i}"
            echo "PC130_PART_${i}_READY"
          done
          cat pc-v130-part{00..10} > FileHub-AIO-PC-1.3.130-win-x64.zip
          test "$(stat -c '%s' FileHub-AIO-PC-1.3.130-win-x64.zip)" -eq 168915274
          echo '5B2DBE19B6DC7C8234C6E4E2359F5D84B96D5724E08054DABF961F922D58797D  FileHub-AIO-PC-1.3.130-win-x64.zip' | sha256sum -c -
          unzip -tqq FileHub-AIO-PC-1.3.130-win-x64.zip
          unzip -Z1 FileHub-AIO-PC-1.3.130-win-x64.zip | grep -Fx FileHubAIO.exe
          unzip -Z1 FileHub-AIO-PC-1.3.130-win-x64.zip | grep -Fx tools/NASMountLockBridge.exe
          unzip -Z1 FileHub-AIO-PC-1.3.130-win-x64.zip | grep -Fx tools/rclone.exe
          unzip -Z1 FileHub-AIO-PC-1.3.130-win-x64.zip | grep -Fx tools/google-oauth-desktop.json
          unzip -Z1 FileHub-AIO-PC-1.3.130-win-x64.zip | grep -Fx README_PC_V130_KR.txt
          printf '%s\n' '5B2DBE19B6DC7C8234C6E4E2359F5D84B96D5724E08054DABF961F922D58797D  FileHub-AIO-PC-1.3.130-win-x64.zip' > SHA256SUMS
          echo 'PC130_OFFICIAL_ARCHIVE_VERIFIED'
      - name: Publish Windows-only OTA v1.3.130
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view pc-v1.3.130 >/dev/null 2>&1; then
            echo 'Version already published: refuse overwrite'
            exit 1
          fi
          gh release create pc-v1.3.130 FileHub-AIO-PC-1.3.130-win-x64.zip SHA256SUMS --target "$GITHUB_SHA" --latest=false --title 'FileHub AIO PC v1.3.130' --notes 'Windows WebDAV WinFsp: reduce 99% copy tail by reusing strong HTTP ETags, skipping redundant remote PROPFIND and DELETE requests, and retaining safe stage MOVE verification. Lab slow-NAS comparison at 4MiB/s plus 600ms finalization latency: 24MiB 99%-tail decreased from approx 6.1s to 3.1s on a server returning MOVE ETag. Normal full WinFsp, Office save, locks, crash recovery, profile backup, updater and Google publisher policy tests passed. The final wait still depends on real NAS PUT/MOVE acknowledgments; no false completion or unsafe background writeback. Other storage providers and Android unchanged. SHA256: 5B2DBE19B6DC7C8234C6E4E2359F5D84B96D5724E08054DABF961F922D58797D.'
          gh release view pc-v1.3.130 --json tagName,url,assets
          echo 'PC130_OFFICIAL_RELEASE_SUCCESS'
