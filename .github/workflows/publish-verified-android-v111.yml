name: Publish signed FileHub Android v0.1.111 (verified)
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[ANDROID_BINARY_HANDOFF_20261123_V111]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: SHA-256 verify publisher-signed Android v0.1.111 APK
        shell: bash
        run: |
          set -euo pipefail
          curl --http1.1 --fail --location --retry 6 --retry-all-errors \
            --retry-delay 3 --connect-timeout 15 --max-time 850 \
            'https://club-extended-scenic-suppose.trycloudflare.com/FileHub-AIO-v0.1.111.apk' -o FileHub-AIO-v0.1.111.apk
          test "$(stat -c '%s' FileHub-AIO-v0.1.111.apk)" -eq 72631745
          echo '0D9F7160A3610C60CAAA719F575F5DC7E10D5FDB2A3C5EEBD3F51D846C84B94D  FileHub-AIO-v0.1.111.apk' | sha256sum -c -
          unzip -Z1 FileHub-AIO-v0.1.111.apk | grep -Fx AndroidManifest.xml
          echo 'ANDROID_V111_PUBLISHER_SIGNED_BINARY_VERIFIED'
      - name: Publish official Android OTA latest v0.1.111
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.1.111 >/dev/null 2>&1; then
            echo 'Existing release detected; refusing overwrite'
            exit 1
          fi
          gh release create v0.1.111 FileHub-AIO-v0.1.111.apk \
            --target "$GITHUB_SHA" --latest \
            --title 'FileHub AIO Android v0.1.111' \
            --notes $'versionCode: 112\n\n- SFTP now opens the authenticated account login home by default via the server SFTP REALPATH(.) instead of listing the filesystem root. Steam Deck deck login normally starts /home/deck; exact path is server-derived and not hardcoded.\n- To start at / explicitly, configure / in the SFTP start path field. Explicit custom start paths and exact saved favorites are unchanged, and root remains available through breadcrumb navigation.\n- Select one writable SFTP file or folder > More > 리눅스 파일 권한 변경 (chmod). Edit owner, group and other read/write/execute checkboxes or Unix octal 755/644/0755, with live rwx preview.\n- SSHJ SFTP LSTAT reads existing POSIX mode; SETSTAT chmod applies after stale-mode check; LSTAT verifies the actual new mode. Symlinks and read-only profiles are blocked, and removing directory owner execute permission requires confirmation. No recursive chmod and no sudo required.\n- Retains existing SFTP crypto/host-key fixes, WebDAV, TeraBox, MYBOX, FTPS, backup settings compatibility and Android Google/OneDrive exclusions. PC v1.3.128 unchanged.\n- 573 unit tests: 0 failed, 1 pre-existing conditional skip. Signed APK versionCode 112, same original publisher certificate.\n- The user already confirmed v0.1.110 SFTP login works; v0.1.111 on-device home discovery and chmod still require field validation.\n- SHA256 0D9F7160A3610C60CAAA719F575F5DC7E10D5FDB2A3C5EEBD3F51D846C84B94D'
          gh release view v0.1.111 --json tagName,url,assets
          echo 'ANDROID_V0_1_111_GITHUB_RELEASE_SUCCESS'
