services:
  filehub-qr-relay:
    build: .
    restart: unless-stopped
    environment:
      PORT: "31887"
      HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:31887:31887"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:31887/health"]
      interval: 30s
      timeout: 5s
      retries: 3
