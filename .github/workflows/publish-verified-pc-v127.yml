name: Publish verified FileHub PC v1.3.127 binary
on:
  push:
    branches: [pc/windows]

permissions:
  contents: write

jobs:
  publish-verified:
    if: contains(github.event.head_commit.message, '[PC_BINARY_HANDOFF_20261121]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Reassemble publisher archive from ten small verified downloads
        shell: bash
        run: |
          set -euo pipefail
          for i in {00..09}; do
            curl --http1.1 --fail --location --retry 5 --retry-all-errors \
              --retry-delay 3 --connect-timeout 15 --max-time 240 \
              "https://ministers-bailey-safely-monthly.trycloudflare.com/pc-v127-part${i}" \
              -o "pc-v127-part${i}"
            test -s "pc-v127-part${i}"
            echo "PART_${i}_DOWNLOADED_OK"
          done
          cat pc-v127-part{00..09} > FileHub-AIO-PC-1.3.127-win-x64.zip
          echo '47398A53A9CE3BEA49F40D7BD49F74E9849A609218A4C6EB37992753AAD194A1  FileHub-AIO-PC-1.3.127-win-x64.zip' | sha256sum -c -
          unzip -Z1 FileHub-AIO-PC-1.3.127-win-x64.zip | grep -E '(^|/)FileHubAIO.exe$'
          unzip -Z1 FileHub-AIO-PC-1.3.127-win-x64.zip | grep -E '(^|/)tools/NASMountLockBridge.exe$'
          unzip -Z1 FileHub-AIO-PC-1.3.127-win-x64.zip | grep -E '(^|/)tools/google-oauth-desktop.json$'
          printf '%s\n' '47398A53A9CE3BEA49F40D7BD49F74E9849A609218A4C6EB37992753AAD194A1  FileHub-AIO-PC-1.3.127-win-x64.zip' > SHA256SUMS
          echo 'VERIFIED_PUBLISHER_WIN64_REASSEMBLED_SHA256_PASS'
      - name: Publish PC-only release without affecting Android latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view pc-v1.3.127 >/dev/null 2>&1; then
            echo 'PC release already exists, refusing overwrite'
            exit 1
          fi
          gh release create pc-v1.3.127 \
            'FileHub-AIO-PC-1.3.127-win-x64.zip' 'SHA256SUMS' \
            --target "$GITHUB_SHA" --latest=false \
            --title 'FileHub AIO PC v1.3.127' \
            --notes 'Google Drive direct Chrome OAuth stays available for approved test users while full Google access review continues. Fixed clipped write option and added yellow registration notice; real Google and WebDAV quota display. Safely close FileHub before upgrading. SHA256SUMS included; no per-user JSON input.'
          gh release view pc-v1.3.127 --json tagName,url,assets
          echo 'OFFICIAL_PC_V1_3_127_RELEASE_PUBLISHED'
